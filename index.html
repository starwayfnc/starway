<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starway Menu</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <script src="auth.js"></script>
    <style>
        /* Base page background matching Payment Collection app */
        body {
            background-color: #15191e;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 24px 16px;
            box-sizing: border-box;
        }

        /* Card container matching the Payment Collection style */
        .card {
            background-color: #1e232a;
            border: 1px solid #2b323b;
            border-radius: 16px;
            padding: 24px;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            box-sizing: border-box;
        }

        /* Side-by-side logo and title header */
        .brand-header {
            display: flex;
            flex-direction: row;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .brand-logo {
            width: 42px;
            height: auto;
            display: block;
            flex-shrink: 0;
        }

        h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.8px;
            line-height: 1;
            color: #00bcd4;
        }

        .user-badge {
            text-align: center;
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 20px;
        }

        /* Mobile-friendly button container */
        .button-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        /* Side-by-side row for the bottom two buttons */
        .bottom-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
        }

        /* Button styling matching the form inputs & buttons */
        button {
            background-color: #15191e;
            color: #ffffff;
            border: 1px solid #2b323b;
            border-radius: 12px;
            padding: 16px 18px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            align-items: center;
            gap: 16px;
            text-align: left;
            box-sizing: border-box;
        }

        /* Compact button adjustments for the side-by-side row */
        .bottom-row button {
            padding: 16px 12px;
            gap: 10px;
        }

        .bottom-row .btn-icon {
            width: 22px;
            height: 22px;
        }

        .bottom-row .btn-title {
            font-size: 13px;
            line-height: 1.25;
            letter-spacing: 0.4px;
        }

        /* Vector icon styling */
        .btn-icon {
            width: 26px;
            height: 26px;
            stroke: #00bcd4;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
            transition: stroke 0.2s ease;
        }

        /* Title styling */
        .btn-title {
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.6px;
            color: #ffffff;
            transition: color 0.2s ease;
        }

        /* Mouse hover effect */
        button:hover {
            background-color: #242b33;
            border-color: #00bcd4;
            transform: translateY(-1px);
        }

        button:hover .btn-icon {
            stroke: #38bdf8;
        }

        button:hover .btn-title {
            color: #38bdf8;
        }

        /* WhatsApp button green accent on icon & hover */
        .wa-menu-btn .btn-icon {
            stroke: #25D366;
        }

        .wa-menu-btn:hover {
            border-color: #25D366;
        }

        .wa-menu-btn:hover .btn-icon {
            stroke: #4ade80;
        }

        .wa-menu-btn:hover .btn-title {
            color: #4ade80;
        }

        /* Logout button red accent */
        .logout-btn {
            justify-content: center;
            padding: 13px 16px;
            border-color: #3f2228;
            margin-top: 2px;
        }
        .logout-btn .btn-icon {
            width: 20px;
            height: 20px;
            stroke: #f43f5e;
        }
        .logout-btn .btn-title {
            font-size: 13.5px;
            color: #fb7185;
        }
        .logout-btn:hover {
            border-color: #f43f5e;
            background-color: #26161a;
        }
        .logout-btn:hover .btn-icon,
        .logout-btn:hover .btn-title {
            stroke: #fda4af;
            color: #fda4af;
        }

        /* Click effect */
        button:active {
            background-color: #12151a;
            transform: translateY(0);
        }
    </style>
</head>

            <h1>STARWAY</h1>
        </div>
        <div id="userBadge" class="user-badge"></div>

    <script>
      window.addEventListener("DOMContentLoaded", function () {
        const s = window.starwayGetSession && window.starwayGetSession();
        if (s) {
          document.getElementById("userBadge").textContent = "Signed in as " + s.name + " (" + s.role + ")";
        }
      });
    </script>
