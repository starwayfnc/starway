<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Payment Due List</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-page: #15191e;
      --bg-card: #1e232a;
      --bg-elevated: #242b33;
      --border-subtle: #2b323b;
      --accent: #00bcd4;
      --accent-hover: #38bdf8;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --table-header-bg: #192028;
      --banner-bg: #15191e;
      --danger: #f43f5e;
      --page-max-width: 480px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: var(--page-max-width);
      background-color: var(--bg-card);
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
    }

    .home-btn-container {
      margin-bottom: 16px;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .home-btn:active {
      transform: translateY(1px);
    }

    .header-title {
      color: var(--accent);
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 20px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .section-banner {
      background-color: var(--banner-bg);
      color: var(--text-main);
      padding: 9px 12px;
      font-weight: 700;
      font-size: 12.5px;
      letter-spacing: 0.5px;
      border: 1px solid var(--border-subtle);
      border-left: 4px solid var(--accent);
      margin-top: 20px;
      margin-bottom: 8px;
      border-radius: 8px;
    }

    .table-container {
      overflow-x: auto;
      margin-bottom: 12px;
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
    }

    table {
      width: 100%;
      white-space: nowrap;
      border-collapse: collapse;
      font-size: 13px;
      background-color: var(--bg-page);
    }

    th {
      background-color: var(--table-header-bg);
      color: var(--accent);
      text-align: left;
      padding: 10px;
      font-weight: 700;
      border-bottom: 1px solid var(--border-subtle);
    }

    td {
      padding: 10px;
      border-bottom: 1px solid var(--border-subtle);
      color: var(--text-main);
    }

    tr:last-child td {
      border-bottom: none;
    }

    tr:hover td {
      background-color: var(--bg-elevated);
    }

    .text-right {
      text-align: right;
    }

    .loading {
      text-align: center;
      padding: 30px;
      color: var(--text-muted);
      font-style: italic;
    }

    @media (max-width: 460px) {
      body { padding: 16px 12px; }
      .container { padding: 18px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="home-btn-container">
    <a class="home-btn" href="index.html">
      &#127968; Home Dashboard
    </a>
  </div>

  <div class="header-title">
    &#128179; Payment Due List
  </div>

  <div id="due-content">
    <div class="loading">Loading active payment dues from database...</div>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec';

  async function loadPaymentDues() {
    try {
      const fetchUrl = APPS_SCRIPT_URL + '?action=duelist';
      const response = await fetch(fetchUrl);
      const rows = await response.json();
      parseAndRenderData(rows);
    } catch (error) {
      console.error(error);
      document.getElementById('due-content').innerHTML = `
        <div style="color: var(--danger); text-align: center; padding: 20px;">
          Failed to load live data. Please check connection.
        </div>`;
    }
  }

  function parseAndRenderData(rows) {
    const container = document.getElementById('due-content');
    container.innerHTML = '';

    if (!rows || rows.length === 0) {
      container.innerHTML = `<div class="loading">No data found.</div>`;
      return;
    }

    let html = '';
    let currentTableOpen = false;

    rows.forEach(row => {
      const firstCell = row[0] ? String(row[0]).trim() : '';

      if (!row[1] && !row[2] && !row[3] && !row[4] && firstCell && !firstCell.toLowerCase().includes('no ')) {
        if (currentTableOpen) {
          html += `</tbody></table></div>`;
          currentTableOpen = false;
        }
        html += `<div class="section-banner">${firstCell}</div>`;
        return;
      }

      if (firstCell.toLowerCase() === 'borrower name') {
        if (currentTableOpen) {
          html += `</tbody></table></div>`;
        }
        html += `
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>${row[0] || ''}</th>
                  <th>${row[1] || ''}</th>
                  <th class="text-right">${row[2] || ''}</th>
                  <th class="text-right">${row[3] || ''}</th>
                  <th>${row[4] || ''}</th>
                </tr>
              </thead>
              <tbody>
        `;
        currentTableOpen = true;
        return;
      }

      if (currentTableOpen) {
        if (!row[1] && !row[2] && !row[3] && !row[4]) {
          html += `
            <tr>
              <td colspan="5" style="text-align: center; color: var(--text-muted); font-style: italic; padding: 15px;">
                ${firstCell}
              </td>
            </tr>
          `;
        } else {
          html += `
            <tr>
              <td>${row[0] || ''}</td>
              <td>${row[1] || ''}</td>
              <td class="text-right">${row[2] || ''}</td>
              <td class="text-right">${row[3] || ''}</td>
              <td>${row[4] || ''}</td>
            </tr>
          `;
        }
      }
    });

    if (currentTableOpen) {
      html += `</tbody></table></div>`;
    }

    container.innerHTML = html;
  }

  loadPaymentDues();
  setInterval(loadPaymentDues, 300000);
</script>

</body>
</html>
