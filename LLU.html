<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan &amp; Customer Lookup</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-page: #15191e;
      --bg-card: #1e232a;
      --bg-elevated: #242b33;
      --border-subtle: #2b323b;
      --accent: #00bcd4;
      --accent-hover: #38bdf8;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --wa-green: #25d366;
      --wa-green-hover: #4ade80;
      --danger: #f43f5e;
      --page-max-width: 480px;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.35;
      font-size: 14px;
    }
    .container {
      width: 100%;
      max-width: var(--page-max-width);
      margin: 0 auto;
    }

    /* Search & Header Panel */
    .main-shell {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      margin-bottom: 12px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
      border-color: var(--accent);
    }
    .today-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      padding: 6px 10px;
      border-radius: 8px;
    }
    .today-badge span {
      color: var(--accent);
      font-weight: 700;
    }

    .page-title-wrap {
      text-align: center;
      margin-bottom: 14px;
    }
    h1 {
      margin: 0;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 6px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 14px;
    }
    input::placeholder { color: #64748b; }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 188, 212, 0.2);
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent);
      color: #0b1320;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }
    button:hover { background-color: var(--accent-hover); }
    button.btn-secondary {
      background-color: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }
    button.btn-secondary:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      color: var(--text-main);
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .err { color: var(--danger); }
    .ok { color: #4ade80; }
    .info { color: var(--accent); }
    .warn { color: #fbbf24; }
    .muted { color: var(--text-muted); }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      text-align: left;
    }
    .card.highlight {
      box-shadow: 0 0 0 1px rgba(0, 188, 212, 0.55), 0 10px 24px rgba(0, 0, 0, 0.4);
    }

    /* Customer Card */
    .customer-card {
      background: linear-gradient(165deg, #1b242d 0%, var(--bg-card) 60%, var(--bg-page) 100%);
      border: 1px solid var(--border-subtle);
      border-top: 4px solid var(--accent);
    }
    .customer-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }
    .customer-hero-main {
      flex: 1 1 220px;
      min-width: 0;
    }
    .customer-name-large {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
    }
    .customer-nickname-inline {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-left: 5px;
    }
    .customer-contact-line {
      margin-top: 7px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px 8px;
      font-size: 13px;
      font-weight: 700;
    }
    .contact-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      padding: 4px 9px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--accent);
    }
    .contact-link:hover {
      border-color: var(--accent);
      color: var(--accent-hover);
    }
    .contact-link.wa-link {
      border-color: rgba(37, 211, 102, 0.45);
      color: var(--wa-green-hover);
    }
    .contact-link.wa-link:hover {
      border-color: var(--wa-green);
      background: rgba(37, 211, 102, 0.14);
    }
    .contact-static {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      padding: 4px 9px;
      border-radius: 8px;
      color: var(--text-muted);
    }
    .customer-address-large {
      margin-top: 7px;
      font-size: 13px;
      color: #cbd5e1;
    }

    /* Introduced By Box */
    .intro-kpi-box {
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      padding: 7px 12px;
      min-width: 135px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .intro-kpi-lbl {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--text-muted);
      line-height: 1.15;
      margin-bottom: 3px;
    }
    .intro-kpi-val {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
    }

    /* Single Customer Metadata Line */
    .customer-meta-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .customer-meta-strip strong {
      color: var(--text-main);
      font-weight: 700;
    }
    .meta-dot {
      color: #475569;
      user-select: none;
    }

    /* 8-Box Loan KPI Grid (2 columns optimized for 480px container) */
    .loan-kpi-grid-8 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }
    .kpi-box {
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 7px 8px;
      min-width: 0;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .kpi-lbl {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.35px;
      color: var(--text-muted);
      line-height: 1.15;
      margin-bottom: 3px;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .kpi-val {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.2;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Active vs Closed Loan Styling */
    .card.loan-active {
      background: linear-gradient(165deg, #162421 0%, var(--bg-card) 100%);
      border: 1px solid rgba(34, 197, 94, 0.35);
      border-left: 5px solid #22c55e;
    }
    .card.loan-closed {
      background: linear-gradient(165deg, var(--bg-card) 0%, #181c22 100%);
      border: 1px solid var(--border-subtle);
      border-left: 5px solid #64748b;
    }

    /* Single Summary Line Below KPI Grid */
    .loan-meta-line {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px 8px;
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .loan-meta-line strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Badges & Tags */
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
      flex-wrap: wrap;
    }
    .badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .card-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--text-main); }
    .tag {
      background-color: var(--bg-page);
      color: #cbd5e1;
      border: 1px solid var(--border-subtle);
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-active {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.45);
    }
    .tag-closed {
      background: rgba(148, 163, 184, 0.14);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.32);
    }
    .tag-seq {
      background: rgba(0, 188, 212, 0.14);
      color: var(--accent);
      border: 1px solid rgba(0, 188, 212, 0.38);
    }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .tag-pink { background: rgba(192, 132, 252, 0.15); color: #e9d5ff; border: 1px solid rgba(192, 132, 252, 0.45); }
    .tag-red { background: rgba(244, 63, 94, 0.18); color: #fda4af; border: 1px solid rgba(244, 63, 94, 0.5); }

    /* Multi-match list */
    .match-list { display: flex; flex-direction: column; gap: 8px; }
    .match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      flex-wrap: wrap;
      transition: all 0.15s ease;
    }
    .match-item:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
    }
    .match-item.match-black { border-color: var(--danger); background: #26161a; }
    .match-main { font-size: 14.5px; font-weight: 700; color: var(--text-main); }
    .match-sub { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; }

    /* Blacklist & Tenure Notes */
    .card.blacklisted {
      border: 2px solid var(--danger);
      background: linear-gradient(160deg, #2a161d 0%, #1d1115 100%);
    }
    .blacklist-banner {
      background-color: var(--danger);
      color: #fff;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12.5px;
    }
    .tag-black { background-color: var(--danger); color: #fff; border: none; }

    .tenure-note {
      margin-bottom: 10px;
      padding: 7px 10px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
    }
    .tenure-note.over { border-color: #f59e0b; color: #fde68a; background: rgba(245, 158, 11, 0.12); }
    .tenure-note.early-bad { border-color: var(--danger); color: #fecaca; background: rgba(244, 63, 94, 0.14); }

    /* Nested Collections History Bar Inside Loan Card */
    .collections-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      width: 100%;
      padding: 8px 11px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease;
    }
    .collections-bar:hover {
      border-color: var(--accent);
    }
    .collections-title {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.35px;
      text-transform: uppercase;
      color: #e2e8f0;
    }
    .collections-action {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }
    .payments-wrap {
      overflow-x: auto;
      margin-top: 8px;
      -webkit-overflow-scrolling: touch;
    }
    .payments-wrap.collapsed { display: none; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background-color: var(--bg-page);
      border-radius: 8px;
      overflow: hidden;
      min-width: 410px;
    }
    th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border-subtle); }
    th {
      color: var(--accent);
      font-size: 11px;
      text-transform: uppercase;
      background-color: #192028;
    }
    tr:last-child td { border-bottom: none; }
    .sl-col { width: 32px; color: var(--text-muted); font-weight: 700; }

    @media (max-width: 460px) {
      body { padding: 16px 12px; }
      .main-shell, .card { padding: 14px; }
      .search-row { grid-template-columns: 1fr 1fr; }
      #searchInput { grid-column: 1 / -1; }
      .search-row button { width: 100%; }
      .intro-kpi-box { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-shell">
      <div class="top-nav">
        <a class="btn-home" href="index.html">&#127968; Home Dashboard</a>
        <div class="today-badge">Today: <span id="todayDateDisplay">-</span></div>
      </div>

      <div class="page-title-wrap">
        <h1>&#128269; Loan &amp; Customer Lookup</h1>
      </div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Loan No. (24) or Name (Madhu)" autofocus />
        <button type="button" onclick="smartLookup()">Search</button>
        <button class="btn-secondary" type="button" onclick="resetSearch()">Clear</button>
      </div>

      <div id="status" class="status">Enter loan no. or customer name.</div>
    </div>

    <div id="output"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec";

    const STANDARD_WEEKS = 10;
    const STANDARD_DAYS = STANDARD_WEEKS * 7;
    const BUFFER_DAYS = 5;
    const STANDARD_INSTALLMENTS = 10;
    const QUICK_RENEWAL_MAX_DAYS = 7;
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const lookupCache = new Map();

    function parseSearchQuery(rawInput) {
      const cleaned = String(rawInput || "").trim();
      if (!cleaned) return null;

      if (/^\d+$/.test(cleaned)) {
        const num = parseInt(cleaned, 10);
        return { type: "loan", value: "SW_L" + String(num).padStart(4, "0") };
      }

      const swlMatch = cleaned.match(/^sw[_-\s]*l[\s_-]*(\d+)$/i);
      if (swlMatch) {
        const num = parseInt(swlMatch[1], 10);
        return { type: "loan", value: "SW_L" + String(num).padStart(4, "0") };
      }

      return { type: "customer", value: cleaned };
    }

    function fmtNum(num) {
      const val = Math.round(Number(num) || 0);
      return val.toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    function sanitizeDigits(val) {
      return String(val || "").replace(/\D/g, "").replace(/^00/, "");
    }

    function buildTelHref(rawNum) {
      const digits = sanitizeDigits(rawNum);
      if (!digits) return "";
      if (digits.length === 10) return `tel:+91${digits}`;
      return `tel:+${digits}`;
    }

    function buildWaHref(rawNum) {
      const digits = sanitizeDigits(rawNum);
      if (!digits) return "";
      const waDigits = digits.length === 10 ? `91${digits}` : digits;
      return `https://wa.me/${waDigits}`;
    }

    function parseValidDate(val) {
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function addDays(dateObj, days) {
      if (!dateObj) return null;
      return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() + days);
    }

    function diffInDays(fromDate, toDate) {
      if (!fromDate || !toDate) return null;
      return Math.round((toDate.getTime() - fromDate.getTime()) / MS_PER_DAY);
    }

    function fmtDate(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      const day = String(d.getDate()).padStart(2, "0");
      return `${day} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function fmtDateWithDay(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      const day = String(d.getDate()).padStart(2, "0");
      return `${day} ${MONTHS[d.getMonth()]} ${d.getFullYear()} (${WEEKDAYS[d.getDay()]})`;
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function domIdSafe(str) {
      return String(str ?? "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function buildAddress(c) {
      const parts = [c.careOf, c.houseName, c.streetName, c.postOffice, c.pinCode]
        .map(x => String(x || "").trim())
        .filter(Boolean);
      return parts.length ? parts.join(", ") : "-";
    }

    function resetSearch() {
      const inputEl = document.getElementById("searchInput");
      inputEl.value = "";
      document.getElementById("output").innerHTML = "";
      document.getElementById("status").innerHTML = "Enter loan no. or customer name.";
      inputEl.focus();
    }

    function togglePayments(safeLoanId) {
      const wrap = document.getElementById(`payments-wrap-${safeLoanId}`);
      const arrow = document.getElementById(`toggle-arrow-${safeLoanId}`);
      const label = document.getElementById(`toggle-label-${safeLoanId}`);
      if (!wrap || !arrow || !label) return;

      const isCollapsed = wrap.classList.toggle("collapsed");
      arrow.innerHTML = isCollapsed ? "&#9662;" : "&#9652;";
      label.textContent = isCollapsed ? "[+ Expand]" : "[- Collapse]";
    }

    function sortLoansChronologically(loans) {
      return [...loans].sort((a, b) => {
        const da = parseValidDate(a.loanDate);
        const db = parseValidDate(b.loanDate);
        const na = parseInt(String(a.loanId || "").replace(/\D+/g, ""), 10) || 0;
        const nb = parseInt(String(b.loanId || "").replace(/\D+/g, ""), 10) || 0;

        if (da && db && da.getTime() !== db.getTime()) {
          return da.getTime() - db.getTime();
        }
        return na - nb;
      });
    }

    function resolveLoanPendingBalance(loan) {
      const statusUpper = String(loan.status || "").trim().toUpperCase();
      if (statusUpper === "CLOSED") return 0;

      const loanAmt = Number(loan.loanAmt) || 0;
      const totalReceived = Number(loan.totalReceived) || 0;
      const rawPending = Number(loan.pendingAmt);

      if (rawPending > 0) return rawPending;
      return Math.max(0, loanAmt - totalReceived);
    }

    function resolveFirstCollectionDate(loan) {
      const explicitFirst =
        parseValidDate(loan.firstColDate) ||
        parseValidDate(loan.firstCollectionDate) ||
        parseValidDate(loan.firstDueDate) ||
        parseValidDate(loan.dueDate);

      if (explicitFirst) return explicitFirst;

      const loanDate = parseValidDate(loan.loanDate);
      if (!loanDate) return null;

      let firstDue = addDays(loanDate, 7);

      const nextCol = parseValidDate(loan.nextColDate);
      if (nextCol) {
        const targetDay = nextCol.getDay();
        const currentDay = firstDue.getDay();
        if (targetDay !== currentDay) {
          let shift = targetDay - currentDay;
          if (shift < -3) shift += 7;
          if (shift > 3) shift -= 7;
          firstDue = addDays(firstDue, shift);
        }
      }

      return firstDue;
    }

    function resolveLoanClosedDate(loan) {
      const explicitClose =
        parseValidDate(loan.closedDate) ||
        parseValidDate(loan.closeDate) ||
        (loan.earlyClosingDiscount && parseValidDate(loan.earlyClosingDiscount.date)) ||
        null;

      let latestPaymentDate = null;
      (loan.payments || []).forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (pd && (!latestPaymentDate || pd.getTime() > latestPaymentDate.getTime())) {
          latestPaymentDate = pd;
        }
      });

      if (latestPaymentDate && explicitClose) {
        return latestPaymentDate.getTime() >= explicitClose.getTime() ? latestPaymentDate : explicitClose;
      }
      return latestPaymentDate || explicitClose;
    }

    function resolveLatestPaymentDate(payments) {
      let latest = null;
      (payments || []).forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (pd && (!latest || pd.getTime() > latest.getTime())) {
          latest = pd;
        }
      });
      return latest;
    }

    function resolveExpectedCloseDate(loan, firstDueDate) {
      const baseDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);
      if (!baseDue) return null;
      return addDays(baseDue, (STANDARD_INSTALLMENTS - 1) * 7);
    }

    function computePaymentRows(loan, firstDueDate) {
      const payments = loan.payments || [];
      const instAmt = Number(loan.instalmentAmt) || 0;
      const loanAmt = Number(loan.loanAmt) || 0;
      const anchorFirstDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);

      let cycleIndex = 0;
      let cycleAccumulated = 0;
      let cycleStarted = false;
      let cumulativePaid = 0;
      let prevPayDate = null;

      return payments.map((p, idx) => {
        const amt = Number(p.amtRcvd) || 0;
        const actual = parseValidDate(p.cltnDate);

        if (!actual) {
          return {
            index: idx,
            cltnDate: p.cltnDate,
            amtRcvd: amt,
            remarks: p.remarks,
            diffText: "-",
            diffCls: "muted",
            dayDiffNum: null
          };
        }

        const alreadySettledBeforeThis = loanAmt > 0 && cumulativePaid >= loanAmt;
        const isSameDayAsPrev = prevPayDate && diffInDays(prevPayDate, actual) === 0;

        cumulativePaid += amt;

        const isPartOfOngoingCycle = cycleStarted && instAmt > 0 && cycleAccumulated < instAmt;

        let diffText = "-";
        let diffCls = "muted";
        let dayDiffNum = null;

        if (isPartOfOngoingCycle) {
          cycleAccumulated += amt;
          const isCompletedNow = cycleAccumulated >= instAmt;
          diffText = isCompletedNow ? "Part (Done)" : "Part (Due)";
          diffCls = isCompletedNow ? "ok" : "warn";

          if (isCompletedNow) {
            cycleIndex += 1;
            cycleAccumulated = 0;
            cycleStarted = false;
          }
        } else if (alreadySettledBeforeThis || (isSameDayAsPrev && cycleIndex > 0 && amt < instAmt)) {
          diffText = "Nil";
          diffCls = "muted";
        } else {
          const scheduledDue = addDays(anchorFirstDue, cycleIndex * 7);
          const days = scheduledDue ? diffInDays(scheduledDue, actual) : null;

          if (days === null) {
            diffText = "-";
            diffCls = "muted";
          } else if (days < 0 && alreadySettledBeforeThis) {
            diffText = "Nil";
            diffCls = "muted";
          } else {
            dayDiffNum = days;
            diffText = `${days} ${Math.abs(days) === 1 ? "Day" : "Days"}`;
            diffCls = days <= 0 ? "ok" : (days <= 2 ? "warn" : "err");
          }

          if (instAmt > 0 && amt < instAmt) {
            cycleAccumulated = amt;
            cycleStarted = true;
          } else {
            cycleIndex += 1;
            cycleAccumulated = 0;
            cycleStarted = false;
          }
        }

        prevPayDate = actual;

        return {
          index: idx,
          cltnDate: p.cltnDate,
          amtRcvd: amt,
          remarks: p.remarks,
          diffText,
          diffCls,
          dayDiffNum
        };
      });
    }

    function countDistinctPaymentWeeks(payments, startDate) {
      const buckets = new Set();
      payments.forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (!pd) return;
        const base = startDate || pd;
        const diffDays = Math.max(0, Math.floor((pd.getTime() - base.getTime()) / MS_PER_DAY));
        buckets.add(Math.floor(diffDays / 7));
      });
      return buckets.size;
    }

    function findNextLoanAfter(currentLoan, closeDate, allLoans) {
      const curDate = parseValidDate(currentLoan.loanDate);
      const curNum = parseInt(String(currentLoan.loanId || "").replace(/\D+/g, ""), 10) || 0;

      let earliestNext = null;

      allLoans.forEach(other => {
        if (other.loanId === currentLoan.loanId) return;
        const otherDate = parseValidDate(other.loanDate);
        const otherNum = parseInt(String(other.loanId || "").replace(/\D+/g, ""), 10) || 0;

        let isAfter = false;
        if (curDate && otherDate) {
          if (otherDate.getTime() > curDate.getTime()) isAfter = true;
          else if (otherDate.getTime() === curDate.getTime() && otherNum > curNum) isAfter = true;
        } else {
          isAfter = otherNum > curNum;
        }

        if (isAfter) {
          if (!earliestNext) {
            earliestNext = { loan: other, date: otherDate };
          } else if (earliestNext.date && otherDate && otherDate.getTime() < earliestNext.date.getTime()) {
            earliestNext = { loan: other, date: otherDate };
          }
        }
      });

      if (!earliestNext) return null;

      let daysAfterClose = null;
      if (closeDate && earliestNext.date) {
        daysAfterClose = Math.round((earliestNext.date.getTime() - closeDate.getTime()) / MS_PER_DAY);
      }

      return {
        loanId: earliestNext.loan.loanId,
        loanAmt: Number(earliestNext.loan.loanAmt) || 0,
        loanDate: earliestNext.date,
        daysAfterClose: daysAfterClose
      };
    }

    function evaluateLoanTenure(loan, allLoans) {
      const payments = loan.payments || [];
      const rawEntryCount = payments.length;
      const statusUpper = String(loan.status || "").trim().toUpperCase();
      const isClosed = statusUpper === "CLOSED";

      const startDate = parseValidDate(loan.loanDate);
      const endDate = isClosed ? resolveLoanClosedDate(loan) : null;

      const discount = loan.earlyClosingDiscount && Number(loan.earlyClosingDiscount.amount) > 0
        ? loan.earlyClosingDiscount
        : null;

      const daysSpan = (startDate && endDate)
        ? Math.max(0, Math.round((endDate.getTime() - startDate.getTime()) / MS_PER_DAY))
        : null;

      const weeksSpan = daysSpan !== null ? Number((daysSpan / 7).toFixed(1)) : null;
      const activeWeeks = countDistinctPaymentWeeks(payments, startDate);

      if (!isClosed) {
        return {
          rawEntryCount,
          activeWeeks,
          weeksSpan,
          daysSpan,
          endDate,
          discount,
          isQuickHigherRenewal: false,
          isOverStandard: false,
          badgeHtml: "",
          noteHtml: ""
        };
      }

      const maxAllowedDays = STANDARD_DAYS + BUFFER_DAYS;
      const isOverStandard = daysSpan !== null && daysSpan > maxAllowedDays;
      const isEarlyClose = (daysSpan !== null && daysSpan < STANDARD_DAYS) || (activeWeeks > 0 && activeWeeks < STANDARD_INSTALLMENTS);

      const nextLoanInfo = findNextLoanAfter(loan, endDate, allLoans);
      const currentLoanAmt = Number(loan.loanAmt) || 0;
      const takenWithin7Days = Boolean(
        nextLoanInfo &&
        nextLoanInfo.daysAfterClose !== null &&
        nextLoanInfo.daysAfterClose >= 0 &&
        nextLoanInfo.daysAfterClose <= QUICK_RENEWAL_MAX_DAYS
      );
      const hasHigherAmount = Boolean(nextLoanInfo && nextLoanInfo.loanAmt > currentLoanAmt);
      const isQuickHigherRenewal = Boolean(isEarlyClose && takenWithin7Days && hasHigherAmount);

      const discountText = discount ? ` (Discount: ${fmtNum(discount.amount)})` : "";
      const nextLoanGapText = nextLoanInfo
        ? (nextLoanInfo.daysAfterClose !== null
            ? `Next loan ${nextLoanInfo.loanId} (${fmtNum(nextLoanInfo.loanAmt)}) taken ${nextLoanInfo.daysAfterClose} Days after close`
            : `Next loan ${nextLoanInfo.loanId} (${fmtNum(nextLoanInfo.loanAmt)}) taken`)
        : "No follow-up loan";

      let badgeHtml = "";
      let noteHtml = "";

      if (isQuickHigherRenewal) {
        badgeHtml = `<span class="tag tag-red">Black Mark &bull; Early + Higher (&le;7 Days)</span>`;
        noteHtml = `<div class="tenure-note early-bad">&#9888;&#65039; Early close (${weeksSpan ?? "-"} Wks / ${rawEntryCount} Pmts)${discountText} + ${nextLoanGapText} &mdash; Flagged.</div>`;
      } else if (isEarlyClose) {
        badgeHtml = `<span class="tag tag-pink">Early Close &bull; Good${discount ? " + Disc" : ""}</span>`;
      } else if (isOverStandard) {
        badgeHtml = `<span class="tag tag-amber">Over Tenure (${weeksSpan ?? "-"} Wks)</span>`;
        noteHtml = `<div class="tenure-note over">&#9888;&#65039; Past 10 Wks + 5 Days (${maxAllowedDays} Days): ${daysSpan ?? "-"} Days (${weeksSpan ?? "-"} Wks) across ${activeWeeks} Wks.</div>`;
      } else if (discount) {
        badgeHtml = `<span class="tag tag-pink">Discount: ${fmtNum(discount.amount)}</span>`;
      }

      return {
        rawEntryCount,
        activeWeeks,
        weeksSpan,
        daysSpan,
        endDate,
        discount,
        isQuickHigherRenewal,
        isOverStandard,
        badgeHtml,
        noteHtml
      };
    }

    function scorePaymentDayDiff(days) {
      if (days <= 0) return 5;
      if (days <= 2) return 2;
      if (days <= 7) return 1;
      return -1;
    }

    function computeCustomerScore(customer, orderedLoans) {
      const isBlacklisted = String(customer.status || "").trim().toUpperCase().includes("BLACK");
      if (isBlacklisted) {
        return { score: 0, rank: "D", rankLabel: "Black Listed" };
      }

      if (!orderedLoans.length) {
        return { score: 65, rank: "B", rankLabel: "New" };
      }

      let totalPaymentPoints = 0;
      let scoredPaymentsCount = 0;
      let loanAdjustments = 0;
      let hasQuickHigherRenewal = false;

      orderedLoans.forEach(loan => {
        const firstDue = resolveFirstCollectionDate(loan);
        const rows = computePaymentRows(loan, firstDue);
        rows.forEach(r => {
          if (typeof r.dayDiffNum === "number") {
            totalPaymentPoints += scorePaymentDayDiff(r.dayDiffNum);
            scoredPaymentsCount += 1;
          }
        });

        const tenure = evaluateLoanTenure(loan, orderedLoans);
        const isClosed = String(loan.status || "").trim().toUpperCase() === "CLOSED";
        const pending = resolveLoanPendingBalance(loan);

        if (isClosed && pending <= 0) loanAdjustments += 4;
        if (tenure.isOverStandard) loanAdjustments -= 8;
        if (tenure.isQuickHigherRenewal) {
          hasQuickHigherRenewal = true;
          loanAdjustments -= 25;
        }
      });

      const avgPts = scoredPaymentsCount > 0 ? totalPaymentPoints / scoredPaymentsCount : 2;
      const normalizedPaymentScore = Math.max(0, Math.min(65, ((avgPts + 1) / 6) * 65));

      let rawScore = Math.round(25 + normalizedPaymentScore + loanAdjustments);
      rawScore = Math.max(0, Math.min(100, rawScore));

      if (hasQuickHigherRenewal && rawScore > 49) rawScore = 49;

      let rank = "B", rankLabel = "Good";
      if (rawScore >= 80) { rank = "A"; rankLabel = "Prime"; }
      else if (rawScore >= 60) { rank = "B"; rankLabel = "Good"; }
      else if (rawScore >= 40) { rank = "C"; rankLabel = "Caution"; }
      else { rank = "D"; rankLabel = "Risk"; }

      return { score: rawScore, rank, rankLabel };
    }

    function applyLookupData(data) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");

      if (!data.ok) {
        statusEl.innerHTML = `<span class="err">${esc(data.error || "Unknown error")}</span>`;
        return;
      }

      if (!data.found) {
        statusEl.innerHTML = `<span class="warn">No matching records found.</span>`;
        outEl.innerHTML = "";
        return;
      }

      if (data.multipleCustomers && Array.isArray(data.matches)) {
        statusEl.innerHTML = `<span class="info">${data.matches.length} matches found &mdash; select one:</span>`;
        renderCustomerMatches(data.matches);
        return;
      }

      const c = data.customer || {};
      statusEl.innerHTML = `<span class="ok">${esc(c.borrowerName || "")} (${esc(c.custId || "")})</span>`;
      renderLookup(data);
    }

    async function fetchLookup(queryParams, statusMessage) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");
      const cacheKey = queryParams;

      if (lookupCache.has(cacheKey)) {
        applyLookupData(lookupCache.get(cacheKey));
        return;
      }

      statusEl.innerHTML = `<span class="info">${esc(statusMessage)}</span>`;
      outEl.innerHTML = "";

      try {
        const url = `${WEB_APP_URL}?action=lookup&${queryParams}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.ok) lookupCache.set(cacheKey, data);
        applyLookupData(data);
      } catch (err) {
        statusEl.innerHTML = '<span class="err">Connection error.</span>';
      }
    }

    function smartLookup() {
      const inputEl = document.getElementById("searchInput");
      const parsed = parseSearchQuery(inputEl.value);

      if (!parsed) {
        document.getElementById("status").innerHTML = '<span class="err">Enter loan no. or customer name.</span>';
        inputEl.focus();
        return;
      }

      if (parsed.type === "loan") {
        inputEl.value = parsed.value;
        fetchLookup(`loanId=${encodeURIComponent(parsed.value)}`, `Loading ${parsed.value}...`);
      } else {
        fetchLookup(`custName=${encodeURIComponent(parsed.value)}`, `Searching "${parsed.value}"...`);
      }
    }

    function selectCustomerById(custId) {
      fetchLookup(`custId=${encodeURIComponent(custId)}`, `Loading ${custId}...`);
    }

    function renderCustomerMatches(matches) {
      const itemsHtml = matches.map(m => {
        const isBlack = String(m.status || "").trim().toUpperCase().includes("BLACK");
        return `
          <div class="match-item ${isBlack ? "match-black" : ""}" onclick="selectCustomerById('${esc(m.custId)}')">
            <div>
              <div class="match-main">
                ${esc(m.borrowerName)}
                ${m.nickName ? `<span style="color:var(--accent); font-weight:600;">(${esc(m.nickName)})</span>` : ""}
              </div>
              <div class="match-sub">
                Introduced By: <strong>${esc(m.guarantorName || "-")}</strong> &bull; Phone: ${esc(m.phoneNum || "-")}
              </div>
            </div>
            <div class="badges">
              ${isBlack ? `<span class="tag tag-black">BLACK LISTED</span>` : ""}
              <span class="tag">${esc(m.custId)}</span>
            </div>
          </div>
        `;
      }).join("");

      document.getElementById("output").innerHTML = `<div class="card"><div class="match-list">${itemsHtml}</div></div>`;
    }

    function renderLookup(data) {
      const c = data.customer || {};
      const chronologicalLoans = sortLoansChronologically(data.loans || []);
      const scoreInfo = computeCustomerScore(c, chronologicalLoans);
      const isBlacklisted = String(c.status || "").trim().toUpperCase().includes("BLACK");

      const rawPhone = String(c.phoneNum || "").trim();
      const rawWa = String(c.waNumber || "").trim();
      const telHref = buildTelHref(rawPhone);
      const waTargetNum = rawWa || rawPhone;
      const waHref = buildWaHref(waTargetNum);
      const hasDistinctWa = Boolean(rawWa && rawWa !== "-" && sanitizeDigits(rawWa) !== sanitizeDigits(rawPhone));

      const phoneChip = telHref
        ? `<a class="contact-link" href="${esc(telHref)}">&#128222; ${esc(rawPhone)}</a>`
        : `<span class="contact-static">&#128222; ${esc(rawPhone || "-")}</span>`;

      const waChip = waHref
        ? `<a class="contact-link wa-link" href="${esc(waHref)}" target="_blank" rel="noopener">&#128172; ${hasDistinctWa ? `WA: ${esc(rawWa)}` : `WA: ${esc(waTargetNum)}`}</a>`
        : `<span class="contact-static">&#128172; -</span>`;

      let html = `
        <div class="card customer-card ${isBlacklisted ? "blacklisted" : ""}">
          ${isBlacklisted ? `<div class="blacklist-banner">&#128683; BLACK LISTED</div>` : ""}

          <div class="customer-hero">
            <div class="customer-hero-main">
              <h2 class="customer-name-large">
                ${esc(c.borrowerName || "-")}
                ${c.nickName ? `<span class="customer-nickname-inline">(${esc(c.nickName)})</span>` : ""}
              </h2>
              <div class="customer-contact-line">
                ${phoneChip}
                ${waChip}
              </div>
              <div class="customer-address-large">&#128205; ${esc(buildAddress(c))}</div>
            </div>

            <div class="intro-kpi-box">
              <div class="intro-kpi-lbl">Introduced By</div>
              <div class="intro-kpi-val">${esc(c.guarantorName || "-")}</div>
            </div>
          </div>

          <div class="customer-meta-strip">
            <span>Cust ID: <strong>${esc(c.custId || "-")}</strong></span>
            <span class="meta-dot">&bull;</span>
            <span>Join Date: <strong>${esc(fmtDate(c.joinDate))}</strong></span>
            <span class="meta-dot">&bull;</span>
            <span>Rank: <strong>${esc(scoreInfo.rank)} ${esc(scoreInfo.rankLabel)}</strong></span>
            <span class="meta-dot">&bull;</span>
            <span>Score: <strong>${scoreInfo.score}/100</strong></span>
          </div>
        </div>
      `;

      const displayLoans = chronologicalLoans
        .map((loan, idx) => ({ loan, loanSequenceNum: idx + 1 }))
        .reverse();

      displayLoans.forEach(({ loan, loanSequenceNum }) => {
        const payments = loan.payments || [];
        const tenure = evaluateLoanTenure(loan, chronologicalLoans);
        const statusUpper = String(loan.status || "").trim().toUpperCase();
        const isLoanClosed = statusUpper === "CLOSED";
        const safeLoanId = domIdSafe(`${loan.loanId}_${loanSequenceNum}`);
        const firstDueDate = resolveFirstCollectionDate(loan);
        const expectedCloseDate = resolveExpectedCloseDate(loan, firstDueDate);
        const closedDate = isLoanClosed ? resolveLoanClosedDate(loan) : null;
        const latestPayDate = resolveLatestPaymentDate(payments);
        const loanPending = resolveLoanPendingBalance(loan);
        const computedRows = computePaymentRows(loan, firstDueDate);
        const guarantorDisplay = loan.guarantorName || c.guarantorName || "-";

        const rowsHtml = computedRows.length
          ? computedRows.map(r => `
              <tr>
                <td class="sl-col">${r.index + 1}</td>
                <td>${esc(fmtDateWithDay(r.cltnDate))}</td>
                <td class="ok">${fmtNum(r.amtRcvd)}</td>
                <td class="${r.diffCls}">${esc(r.diffText)}</td>
                <td>${esc(r.remarks || "-")}</td>
              </tr>
            `).join("")
          : `<tr><td colspan="5" style="color:var(--text-muted);">No payments.</td></tr>`;

        const loanShadeClass = isLoanClosed ? "loan-closed" : "loan-active";
        const statusTagClass = isLoanClosed ? "tag-closed" : "tag-active";
        const extraCardClasses = [loanShadeClass, loan.isSearchedLoan ? "highlight" : ""].filter(Boolean).join(" ");
        const loanBadgeLabel = data.searchedByLoan
          ? (loan.isSearchedLoan ? "Searched" : "Other Loan")
          : "Loan";

        const eighthBoxHtml = isLoanClosed
          ? `
            <div class="kpi-box">
              <div class="kpi-lbl">Closed On</div>
              <div class="kpi-val">${esc(fmtDateWithDay(closedDate))}</div>
            </div>
          `
          : `
            <div class="kpi-box">
              <div class="kpi-lbl">Next Due</div>
              <div class="kpi-val">${esc(fmtDateWithDay(loan.nextColDate))}</div>
            </div>
          `;

        const metaLineHtml = isLoanClosed
          ? `
            <div class="loan-meta-line">
              <span>Expected Close: <strong>${esc(fmtDateWithDay(expectedCloseDate))}</strong></span>
              <span class="meta-dot">&bull;</span>
              <span>Closed On: <strong>${esc(fmtDateWithDay(closedDate))}</strong></span>
              ${tenure.discount ? `<span class="meta-dot">&bull;</span><span>Discount: <strong>${fmtNum(tenure.discount.amount)}</strong></span>` : ""}
            </div>
          `
          : `
            <div class="loan-meta-line">
              <span>Expected Close: <strong>${esc(fmtDateWithDay(expectedCloseDate))}</strong></span>
              <span class="meta-dot">&bull;</span>
              <span>Last Collection: <strong>${esc(fmtDateWithDay(latestPayDate))}</strong></span>
            </div>
          `;

        html += `
          <div class="card ${extraCardClasses}">
            <div class="card-top">
              <h2 class="card-title">#${loanSequenceNum} ${esc(loan.loanId || "-")}</h2>
              <div class="badges">
                <span class="tag tag-seq">${loanSequenceNum}/${chronologicalLoans.length}</span>
                <span class="tag ${statusTagClass}">${esc(loan.status || (isLoanClosed ? "CLOSED" : "ACTIVE"))}</span>
                ${tenure.badgeHtml}
                <span class="tag">${loanBadgeLabel}</span>
              </div>
            </div>

            <div class="loan-kpi-grid-8">
              <div class="kpi-box">
                <div class="kpi-lbl">Loan Amount</div>
                <div class="kpi-val">${fmtNum(loan.loanAmt)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Loan Date</div>
                <div class="kpi-val">${esc(fmtDateWithDay(loan.loanDate))}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">1st Due</div>
                <div class="kpi-val">${esc(fmtDateWithDay(firstDueDate))}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Guarantor</div>
                <div class="kpi-val">${esc(guarantorDisplay)}</div>
              </div>

              <div class="kpi-box">
                <div class="kpi-lbl">Collected</div>
                <div class="kpi-val">${fmtNum(loan.totalReceived)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Pending</div>
                <div class="kpi-val">${fmtNum(loanPending)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Paid Weeks</div>
                <div class="kpi-val">${tenure.activeWeeks} / ${STANDARD_WEEKS} Wks</div>
              </div>
              ${eighthBoxHtml}
            </div>

            ${metaLineHtml}
            ${tenure.noteHtml}

            <div class="collections-bar" onclick="togglePayments('${safeLoanId}')">
              <span class="collections-title"><span id="toggle-arrow-${safeLoanId}">&#9662;</span> Collections History (${payments.length})</span>
              <span class="collections-action" id="toggle-label-${safeLoanId}">[+ Expand]</span>
            </div>

            <div class="payments-wrap collapsed" id="payments-wrap-${safeLoanId}">
              <table>
                <thead>
                  <tr>
                    <th class="sl-col">#</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Diff</th>
                    <th>Mode / Remarks</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      });

      document.getElementById("output").innerHTML = html;
    }

    document.getElementById("todayDateDisplay").textContent = fmtDateWithDay(new Date());

    const searchInputEl = document.getElementById("searchInput");
    searchInputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") smartLookup();
    });

    const initialParam = new URLSearchParams(window.location.search).get("q");
    if (initialParam) {
      searchInputEl.value = initialParam;
      smartLookup();
    }
  </script>
</body>
</html>
