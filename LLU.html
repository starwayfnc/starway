<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan &amp; Customer Lookup</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon" />
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-page: #15191e;
      --bg-card: #1e232a;
      --bg-elevated: #242b33;
      --border-subtle: #2b323b;
      --accent: #00bcd4;
      --accent-hover: #38bdf8;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --wa-green: #25d366;
      --wa-green-hover: #4ade80;
      --danger: #f43f5e;
      --page-max-width: 480px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px 16px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      line-height: 1.35;
      font-size: 14px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: var(--page-max-width);
    }

    /* Search & Header Panel */
    .panel {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }

    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-home:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .btn-home:active {
      transform: translateY(1px);
    }

    .today-badge {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      padding: 6px 10px;
      border-radius: 8px;
    }

    .today-badge span {
      color: var(--accent);
      font-weight: 700;
    }

    h1 {
      margin: 0 0 12px 0;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      color: var(--accent);
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }

    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      background-color: var(--bg-page);
      color: var(--text-main);
      font-size: 14px;
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 188, 212, 0.2);
    }

    button {
      padding: 10px 14px;
      border: none;
      border-radius: 10px;
      background-color: var(--accent);
      color: #0b1320;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    button:hover {
      background-color: var(--accent-hover);
    }

    button.btn-secondary {
      background-color: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    button.btn-secondary:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      color: var(--text-main);
    }

    .status {
      margin-top: 10px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: center;
      font-weight: 600;
    }

    .err { color: var(--danger); }
    .ok { color: #4ade80; }
    .info { color: var(--accent); }
    .warn { color: #fbbf24; }
    .muted { color: var(--text-muted); }

    /* Cards */
    .card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .card.highlight {
      border-color: var(--accent);
    }

    /* Customer Card */
    .customer-card {
      background-color: #192231;
      border-color: #2e4361;
      border-top: 3px solid var(--accent);
    }

    .customer-card.blacklisted {
      background-color: #26141a;
      border: 2px solid var(--danger);
    }

    .blacklist-banner {
      background-color: #dc2626;
      color: #ffffff;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      margin-bottom: 10px;
      font-size: 12px;
      text-align: center;
    }

    .customer-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 8px;
    }

    .customer-title-block {
      flex: 1 1 auto;
      min-width: 0;
    }

    .customer-name {
      margin: 0;
      font-size: 18.5px;
      font-weight: 800;
      color: var(--text-main);
      line-height: 1.25;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
    }

    .cust-id-inline {
      font-size: 11px;
      font-weight: 700;
      color: var(--accent);
      background-color: var(--bg-page);
      border: 1px solid #2e4c6d;
      padding: 2px 7px;
      border-radius: 999px;
      letter-spacing: 0.3px;
    }

    .customer-nick {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 2px;
    }

    .intro-kpi-box {
      flex: 0 0 auto;
      background-color: var(--bg-page);
      border: 1px solid #2e4361;
      border-radius: 8px;
      padding: 6px 10px;
      text-align: left;
      min-width: 118px;
      max-width: 155px;
    }

    .intro-kpi-box .kpi-lbl {
      color: #7dd3fc;
    }

    .customer-sub-block {
      padding-bottom: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid #2b3648;
    }

    .contact-row {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
    }
    .contact-link, .contact-static {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #15191e;
      border: 1px solid #2b323b;
      padding: 5px 10px;
      border-radius: 7px;
      text-decoration: none;
      color: #f8fafc;
    }
    .contact-link svg, .contact-static svg {
      width: 15px;
      height: 15px;
      flex-shrink: 0;
    }
    .contact-link:hover { border-color: #38bdf8; color: #38bdf8; }
    .contact-link.wa-link { border-color: #1f6e43; color: #4ade80; }
    .contact-link.wa-link:hover { border-color: #25D366; color: #86efac; }
    .contact-static { color: #94a3b8; }

    .customer-address {
      margin-top: 8px;
      font-size: 12.5px;
      color: #cbd5e1;
    }

    .customer-badges-row {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }

    /* KPI Grids */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .loan-kpi-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
      margin-bottom: 10px;
    }

    .kpi-box {
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 6px 7px;
      min-width: 0;
      text-align: left;
    }

    .kpi-box.featured-date {
      border-color: #2e4c6d;
    }

    .kpi-lbl {
      font-size: 9.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.25px;
      color: var(--text-muted);
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    .kpi-val {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: left;
    }

    /* Active vs Closed Loan Cards */
    .card.loan-active {
      background-color: #14201b;
      border-color: #244736;
      border-left: 4px solid #22c55e;
    }

    .card.loan-closed {
      background-color: #1b1f26;
      border-color: var(--border-subtle);
      border-left: 4px solid #64748b;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-subtle);
      flex-wrap: wrap;
    }

    .card-title {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .badges {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tag {
      background-color: var(--bg-page);
      color: var(--accent);
      border: 1px solid var(--border-subtle);
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .tag-active { color: #4ade80; border-color: #245c38; }
    .tag-closed { color: #cbd5e1; border-color: #475569; }
    .tag-seq { color: #7dd3fc; border-color: #2b4c6b; }
    .tag-rank-a { color: #4ade80; border-color: #245c38; }
    .tag-rank-b { color: #7dd3fc; border-color: #2b4c6b; }
    .tag-rank-c { color: #fbbf24; border-color: #6b4f1d; }
    .tag-rank-d { color: #fca5a5; border-color: #7f2727; }
    .tag-amber { color: #fbbf24; border-color: #6b4f1d; }
    .tag-pink { color: #e9d5ff; border-color: #5b3878; }
    .tag-red { color: #fca5a5; border-color: #7f2727; }
    .tag-black { background-color: #dc2626; color: #ffffff; border: none; }

    /* Non-duplicated metadata rows */
    .meta-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 10px;
    }

    .lbl {
      font-size: 10.5px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
    }

    .val {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      word-break: break-word;
    }

    /* Multi-match list */
    .match-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      flex-wrap: wrap;
      transition: all 0.15s ease;
    }

    .match-item:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
    }

    .match-item.match-black {
      border-color: var(--danger);
      background-color: #26141a;
    }

    .match-main {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-main);
    }

    .match-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    /* Collections History */
    .collections-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px solid var(--border-subtle);
    }

    .collections-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.4px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .toggle-btn {
      padding: 6px 11px;
      font-size: 12px;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
    }

    .toggle-btn:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      color: var(--accent-hover);
    }

    .payments-wrap {
      overflow-x: auto;
      margin-top: 8px;
    }

    .payments-wrap.collapsed {
      display: none;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background-color: var(--bg-page);
      border-radius: 8px;
      overflow: hidden;
      min-width: 380px;
    }

    th, td {
      text-align: left;
      padding: 7px 8px;
      border-bottom: 1px solid var(--border-subtle);
    }

    th {
      color: var(--accent);
      font-size: 10.5px;
      text-transform: uppercase;
      background-color: #192028;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .sl-col {
      width: 28px;
      color: var(--text-muted);
      font-weight: 700;
    }

    @media (max-width: 460px) {
      body {
        padding: 16px 12px;
        font-size: 13.5px;
      }

      .panel, .card {
        padding: 14px;
        margin-bottom: 10px;
      }

      .search-row {
        grid-template-columns: 1fr 1fr;
      }

      #searchInput {
        grid-column: 1 / -1;
      }

      .search-row button {
        width: 100%;
      }

      .customer-name {
        font-size: 17px;
      }

      .intro-kpi-box {
        min-width: 105px;
        max-width: 135px;
        padding: 5px 8px;
      }

      .loan-kpi-grid {
        gap: 5px;
      }

      .kpi-box {
        padding: 5px 6px;
      }

      .kpi-lbl {
        font-size: 9px;
      }

      .kpi-val {
        font-size: 12.5px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="panel">
      <div class="top-nav">
        <a class="btn-home" href="index.html">&#127968; Home Dashboard</a>
        <div class="today-badge">Today: <span id="todayDateDisplay">-</span></div>
      </div>

      <h1>&#128269; Loan &amp; Customer Lookup</h1>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Loan No. (24) or Name (Madhu)" autofocus />
        <button type="button" onclick="smartLookup()">Search</button>
        <button class="btn-secondary" type="button" onclick="resetSearch()">Clear</button>
      </div>

      <div id="status" class="status">Enter loan no. or customer name.</div>
    </div>

    <div id="output"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec";
    const LAST_RESULT_KEY = "starway_llu_last";

    const STANDARD_WEEKS = 10;
    const STANDARD_DAYS = STANDARD_WEEKS * 7;
    const BUFFER_DAYS = 5;
    const STANDARD_INSTALLMENTS = 10;
    const QUICK_RENEWAL_MAX_DAYS = 7;
    const MS_PER_DAY = 86400000;

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const lookupCache = new Map();

    function parseSearchQuery(rawInput) {
      const cleaned = String(rawInput || "").trim();
      if (!cleaned) return null;

      if (/^\d+$/.test(cleaned)) {
        return { type: "loan", value: "SW_L" + String(parseInt(cleaned, 10)).padStart(4, "0") };
      }

      const swlMatch = cleaned.match(/^sw[_-\s]*l[\s_-]*(\d+)$/i);
      if (swlMatch) {
        return { type: "loan", value: "SW_L" + String(parseInt(swlMatch[1], 10)).padStart(4, "0") };
      }

      return { type: "customer", value: cleaned };
    }

    function fmtNum(num) {
      return Math.round(Number(num) || 0).toLocaleString("en-IN", { maximumFractionDigits: 0 });
    }

    function sanitizeDigits(val) {
      return String(val || "").replace(/\D/g, "").replace(/^00/, "");
    }

    function buildTelHref(rawNum) {
      const d = sanitizeDigits(rawNum);
      return !d ? "" : (d.length === 10 ? `tel:+91${d}` : `tel:+${d}`);
    }

    function buildWaHref(rawNum) {
      const d = sanitizeDigits(rawNum);
      return !d ? "" : `https://wa.me/${d.length === 10 ? "91" + d : d}`;
    }

    function parseValidDate(val) {
      if (!val) return null;
      const d = new Date(val);
      return isNaN(d.getTime()) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function addDays(dateObj, days) {
      return dateObj ? new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() + days) : null;
    }

    function diffInDays(fromDate, toDate) {
      return (fromDate && toDate) ? Math.round((toDate.getTime() - fromDate.getTime()) / MS_PER_DAY) : null;
    }

    function fmtDate(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      return `${String(d.getDate()).padStart(2, "0")} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function fmtDateWithDay(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      return `${fmtDate(d)} (${WEEKDAYS[d.getDay()]})`;
    }

    function getDayTag(val) {
      const d = parseValidDate(val);
      return d ? ` (${WEEKDAYS[d.getDay()].toUpperCase()})` : "";
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function domIdSafe(str) {
      return String(str ?? "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function buildAddress(c) {
      const parts = [c.careOf, c.houseName, c.streetName, c.postOffice, c.pinCode]
        .map(x => String(x || "").trim())
        .filter(Boolean);
      return parts.length ? parts.join(", ") : "-";
    }

    function resetSearch() {
      const inputEl = document.getElementById("searchInput");
      inputEl.value = "";
      document.getElementById("output").innerHTML = "";
      document.getElementById("status").innerHTML = "Enter loan no. or customer name.";
      try { sessionStorage.removeItem(LAST_RESULT_KEY); } catch (e) {}
      inputEl.focus();
    }

    function togglePayments(safeLoanId) {
      const wrap = document.getElementById(`payments-wrap-${safeLoanId}`);
      const btn = document.getElementById(`toggle-btn-${safeLoanId}`);
      if (!wrap || !btn) return;
      const isCollapsed = wrap.classList.toggle("collapsed");
      btn.innerHTML = isCollapsed ? "&#9656; Expand" : "&#9662; Collapse";
    }

    function sortLoansChronologically(loans) {
      return [...loans].sort((a, b) => {
        const da = parseValidDate(a.loanDate);
        const db = parseValidDate(b.loanDate);
        if (da && db && da.getTime() !== db.getTime()) return da.getTime() - db.getTime();
        const na = parseInt(String(a.loanId || "").replace(/\D+/g, ""), 10) || 0;
        const nb = parseInt(String(b.loanId || "").replace(/\D+/g, ""), 10) || 0;
        return na - nb;
      });
    }

    function resolveLoanPendingBalance(loan) {
      if (String(loan.status || "").trim().toUpperCase() === "CLOSED") return 0;
      const rawPending = Number(loan.pendingAmt);
      if (rawPending > 0) return rawPending;
      return Math.max(0, (Number(loan.loanAmt) || 0) - (Number(loan.totalReceived) || 0));
    }

    function summarizePaymentModes(payments) {
      let upi = 0, cash = 0, other = 0;
      (payments || []).forEach(p => {
        const r = String(p.remarks || "").trim().toUpperCase();
        if (!r) return;
        if (r.includes("UPI")) upi += 1;
        else if (r.includes("CASH")) cash += 1;
        else other += 1;
      });
      const parts = [];
      if (upi > 0) parts.push(`UPI: ${upi}`);
      if (cash > 0) parts.push(`Cash: ${cash}`);
      if (other > 0) parts.push(`Other: ${other}`);
      return parts.length ? parts.join(" \u2022 ") : "-";
    }

    function resolveFirstCollectionDate(loan) {
      const explicitFirst =
        parseValidDate(loan.firstColDate) ||
        parseValidDate(loan.firstCollectionDate) ||
        parseValidDate(loan.firstDueDate) ||
        parseValidDate(loan.dueDate);
      if (explicitFirst) return explicitFirst;

      const loanDate = parseValidDate(loan.loanDate);
      if (!loanDate) return null;

      let firstDue = addDays(loanDate, 7);
      const nextCol = parseValidDate(loan.nextColDate);
      if (nextCol) {
        let shift = nextCol.getDay() - firstDue.getDay();
        if (shift < -3) shift += 7;
        if (shift > 3) shift -= 7;
        firstDue = addDays(firstDue, shift);
      }
      return firstDue;
    }

    function resolveLoanClosedDate(loan) {
      const explicitClose =
        parseValidDate(loan.closedDate) ||
        parseValidDate(loan.closeDate) ||
        (loan.earlyClosingDiscount && parseValidDate(loan.earlyClosingDiscount.date)) ||
        null;

      let latestPaymentDate = null;
      (loan.payments || []).forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (pd && (!latestPaymentDate || pd.getTime() > latestPaymentDate.getTime())) {
          latestPaymentDate = pd;
        }
      });

      if (latestPaymentDate && explicitClose) {
        return latestPaymentDate.getTime() >= explicitClose.getTime() ? latestPaymentDate : explicitClose;
      }
      return latestPaymentDate || explicitClose;
    }

    function resolveLatestPaymentDate(payments) {
      let latest = null;
      (payments || []).forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (pd && (!latest || pd.getTime() > latest.getTime())) latest = pd;
      });
      return latest;
    }

    function resolveExpectedCloseDate(loan, firstDueDate) {
      const baseDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);
      return baseDue ? addDays(baseDue, (STANDARD_INSTALLMENTS - 1) * 7) : null;
    }

    function formatDiffLabel(days) {
      if (days < 0) {
        return `${Math.abs(days)}D EARLY`;
      }
      return `${days} ${days === 1 ? "DAY" : "DAYS"}`;
    }

    function computePaymentRows(loan, firstDueDate) {
      const payments = loan.payments || [];
      const instAmt = Number(loan.instalmentAmt) || 0;
      const loanAmt = Number(loan.loanAmt) || 0;
      const anchorFirstDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);
      const isClosedLoan = String(loan.status || "").trim().toUpperCase() === "CLOSED";

      let cycleIndex = 0;
      let cycleAccumulated = 0;
      let cyclePartCount = 0;
      let cycleStarted = false;
      let cumulativePaid = 0;
      let prevPayDate = null;

      return payments.map((p, idx) => {
        const amt = Number(p.amtRcvd) || 0;
        const actual = parseValidDate(p.cltnDate);

        if (!actual) {
          return {
            index: idx,
            cltnDate: p.cltnDate,
            amtRcvd: amt,
            remarks: p.remarks,
            diffText: "-",
            diffCls: "muted",
            dayDiffNum: null
          };
        }

        const alreadySettledBeforeThis = loanAmt > 0 && cumulativePaid >= loanAmt;
        const isClosingPayment = isClosedLoan && loanAmt > 0 && cumulativePaid < loanAmt && (cumulativePaid + amt) >= loanAmt;
        const isSameDayAsPrev = prevPayDate && diffInDays(prevPayDate, actual) === 0;

        cumulativePaid += amt;

        const isPartOfOngoingCycle = cycleStarted && instAmt > 0 && cycleAccumulated < instAmt;

        let diffText = "-";
        let diffCls = "muted";
        let dayDiffNum = null;

        if (isPartOfOngoingCycle) {
          cyclePartCount += 1;
          cycleAccumulated += amt;
          const isCompletedNow = cycleAccumulated >= instAmt;

          if (!isCompletedNow) {
            diffText = `PART (${cyclePartCount})`;
            diffCls = "warn";
          } else {
            const scheduledDue = addDays(anchorFirstDue, cycleIndex * 7);
            const days = scheduledDue ? diffInDays(scheduledDue, actual) : null;

            if (days === null) {
              diffText = "-";
              diffCls = "muted";
            } else {
              dayDiffNum = days;
              diffText = formatDiffLabel(days);
              diffCls = days <= 0 ? "ok" : (days <= 2 ? "warn" : "err");
            }

            const extraFullCycles = instAmt > 0 ? Math.max(0, Math.floor(cycleAccumulated / instAmt) - 1) : 0;
            const remainderInCycle = instAmt > 0 ? (cycleAccumulated % instAmt) : 0;

            cycleIndex += 1 + extraFullCycles;
            if (remainderInCycle > 0 && !alreadySettledBeforeThis && !isClosingPayment) {
              cycleAccumulated = remainderInCycle;
              cyclePartCount = 1;
              cycleStarted = true;
            } else {
              cycleAccumulated = 0;
              cyclePartCount = 0;
              cycleStarted = false;
            }
          }
        } else if (alreadySettledBeforeThis || (isSameDayAsPrev && cycleIndex > 0 && amt < instAmt && !isClosingPayment)) {
          diffText = "NIL";
          diffCls = "muted";
        } else if (instAmt > 0 && amt < instAmt && !isClosingPayment) {
          cyclePartCount = 1;
          cycleAccumulated = amt;
          cycleStarted = true;
          diffText = `PART (${cyclePartCount})`;
          diffCls = "warn";
        } else {
          const scheduledDue = addDays(anchorFirstDue, cycleIndex * 7);
          const days = scheduledDue ? diffInDays(scheduledDue, actual) : null;

          if (days === null) {
            diffText = "-";
            diffCls = "muted";
          } else if (days < 0 && alreadySettledBeforeThis && !isClosingPayment) {
            diffText = "NIL";
            diffCls = "muted";
          } else {
            dayDiffNum = days;
            diffText = formatDiffLabel(days);
            diffCls = days <= 0 ? "ok" : (days <= 2 ? "warn" : "err");
          }

          const coveredCycles = instAmt > 0 ? Math.max(1, Math.floor(amt / instAmt)) : 1;
          const remainder = instAmt > 0 ? (amt % instAmt) : 0;
          cycleIndex += coveredCycles;

          if (remainder > 0 && !alreadySettledBeforeThis && !isClosingPayment) {
            cycleAccumulated = remainder;
            cyclePartCount = 1;
            cycleStarted = true;
          } else {
            cycleAccumulated = 0;
            cyclePartCount = 0;
            cycleStarted = false;
          }
        }

        prevPayDate = actual;

        return {
          index: idx,
          cltnDate: p.cltnDate,
          amtRcvd: amt,
          remarks: p.remarks,
          diffText,
          diffCls,
          dayDiffNum
        };
      });
    }

    function countDistinctPaymentWeeks(payments, startDate) {
      const buckets = new Set();
      payments.forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (!pd) return;
        const base = startDate || pd;
        const diffDays = Math.max(0, Math.floor((pd.getTime() - base.getTime()) / MS_PER_DAY));
        buckets.add(Math.floor(diffDays / 7));
      });
      return buckets.size;
    }

    function findNextLoanAfter(currentLoan, closeDate, allLoans) {
      const curDate = parseValidDate(currentLoan.loanDate);
      const curNum = parseInt(String(currentLoan.loanId || "").replace(/\D+/g, ""), 10) || 0;
      let earliestNext = null;

      allLoans.forEach(other => {
        if (other.loanId === currentLoan.loanId) return;
        const otherDate = parseValidDate(other.loanDate);
        const otherNum = parseInt(String(other.loanId || "").replace(/\D+/g, ""), 10) || 0;

        let isAfter = false;
        if (curDate && otherDate) {
          if (otherDate.getTime() > curDate.getTime()) isAfter = true;
          else if (otherDate.getTime() === curDate.getTime() && otherNum > curNum) isAfter = true;
        } else {
          isAfter = otherNum > curNum;
        }

        if (isAfter) {
          if (!earliestNext || (earliestNext.date && otherDate && otherDate.getTime() < earliestNext.date.getTime())) {
            earliestNext = { loan: other, date: otherDate };
          }
        }
      });

      if (!earliestNext) return null;
      const daysAfterClose = (closeDate && earliestNext.date)
        ? Math.round((earliestNext.date.getTime() - closeDate.getTime()) / MS_PER_DAY)
        : null;

      return {
        loanId: earliestNext.loan.loanId,
        loanAmt: Number(earliestNext.loan.loanAmt) || 0,
        daysAfterClose
      };
    }

    function evaluateLoanTenure(loan, allLoans) {
      const payments = loan.payments || [];
      const isClosed = String(loan.status || "").trim().toUpperCase() === "CLOSED";
      const startDate = parseValidDate(loan.loanDate);
      const endDate = isClosed ? resolveLoanClosedDate(loan) : null;
      const discount = loan.earlyClosingDiscount && Number(loan.earlyClosingDiscount.amount) > 0
        ? loan.earlyClosingDiscount
        : null;

      const daysSpan = (startDate && endDate)
        ? Math.max(0, Math.round((endDate.getTime() - startDate.getTime()) / MS_PER_DAY))
        : null;
      const weeksSpan = daysSpan !== null ? Number((daysSpan / 7).toFixed(1)) : null;
      const activeWeeks = countDistinctPaymentWeeks(payments, startDate);

      if (!isClosed) {
        return { activeWeeks, weeksSpan, daysSpan, discount, isQuickHigherRenewal: false, isOverStandard: false, badgeHtml: "" };
      }

      const maxAllowedDays = STANDARD_DAYS + BUFFER_DAYS;
      const isOverStandard = daysSpan !== null && daysSpan > maxAllowedDays;
      const isEarlyClose = (daysSpan !== null && daysSpan < STANDARD_DAYS) || (activeWeeks > 0 && activeWeeks < STANDARD_INSTALLMENTS);

      const nextLoanInfo = findNextLoanAfter(loan, endDate, allLoans);
      const takenWithin7Days = Boolean(
        nextLoanInfo &&
        nextLoanInfo.daysAfterClose !== null &&
        nextLoanInfo.daysAfterClose >= 0 &&
        nextLoanInfo.daysAfterClose <= QUICK_RENEWAL_MAX_DAYS
      );
      const hasHigherAmount = Boolean(nextLoanInfo && nextLoanInfo.loanAmt > (Number(loan.loanAmt) || 0));
      const isQuickHigherRenewal = Boolean(isEarlyClose && takenWithin7Days && hasHigherAmount);

      let badgeHtml = "";
      if (isQuickHigherRenewal) {
        badgeHtml = `<span class="tag tag-red">BLACK MARK &bull; EARLY + HIGHER (&le;7D)</span>`;
      } else if (isEarlyClose) {
        badgeHtml = `<span class="tag tag-pink">EARLY CLOSE &bull; GOOD${discount ? " + DISC" : ""}</span>`;
      } else if (isOverStandard) {
        badgeHtml = `<span class="tag tag-amber">OVER TENURE (${weeksSpan ?? "-"}W)</span>`;
      } else if (discount) {
        badgeHtml = `<span class="tag tag-pink">DISCOUNT: ${fmtNum(discount.amount)}</span>`;
      }

      return { activeWeeks, weeksSpan, daysSpan, discount, isQuickHigherRenewal, isOverStandard, badgeHtml };
    }

    function scorePaymentDayDiff(days) {
      if (days <= 0) return 5;
      if (days <= 2) return 2;
      if (days <= 7) return 1;
      return -1;
    }

    function computeCustomerScore(customer, orderedLoans) {
      const isBlacklisted = String(customer.status || "").trim().toUpperCase().includes("BLACK");
      if (isBlacklisted) {
        return { score: 0, rank: "D", badgeCls: "tag-rank-d", reason: "Black Listed" };
      }
      if (!orderedLoans.length) {
        return { score: 65, rank: "B", badgeCls: "tag-rank-b", reason: "No loans yet" };
      }

      let totalPaymentPoints = 0;
      let scoredPaymentsCount = 0;
      let loanAdjustments = 0;
      let hasQuickHigherRenewal = false;

      orderedLoans.forEach(loan => {
        const firstDue = resolveFirstCollectionDate(loan);
        computePaymentRows(loan, firstDue).forEach(r => {
          if (typeof r.dayDiffNum === "number") {
            totalPaymentPoints += scorePaymentDayDiff(r.dayDiffNum);
            scoredPaymentsCount += 1;
          }
        });

        const tenure = evaluateLoanTenure(loan, orderedLoans);
        const isClosed = String(loan.status || "").trim().toUpperCase() === "CLOSED";
        if (isClosed && resolveLoanPendingBalance(loan) <= 0) loanAdjustments += 4;
        if (tenure.isOverStandard) loanAdjustments -= 8;
        if (tenure.isQuickHigherRenewal) {
          hasQuickHigherRenewal = true;
          loanAdjustments -= 25;
        }
      });

      const avgPts = scoredPaymentsCount > 0 ? totalPaymentPoints / scoredPaymentsCount : 2;
      const normalizedPaymentScore = Math.max(0, Math.min(65, ((avgPts + 1) / 6) * 65));
      let rawScore = Math.max(0, Math.min(100, Math.round(25 + normalizedPaymentScore + loanAdjustments)));
      if (hasQuickHigherRenewal && rawScore > 49) rawScore = 49;

      let rank = "B", badgeCls = "tag-rank-b";
      if (rawScore >= 80) { rank = "A"; badgeCls = "tag-rank-a"; }
      else if (rawScore >= 60) { rank = "B"; badgeCls = "tag-rank-b"; }
      else if (rawScore >= 40) { rank = "C"; badgeCls = "tag-rank-c"; }
      else { rank = "D"; badgeCls = "tag-rank-d"; }

      return {
        score: rawScore,
        rank,
        badgeCls,
        reason: scoredPaymentsCount > 0 ? `Avg ${avgPts.toFixed(1)} pts (${scoredPaymentsCount} pmts)` : "Loan history"
      };
    }

    function applyLookupData(data, queryText) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");

      if (!data.ok) {
        statusEl.innerHTML = `<span class="err">${esc(data.error || "Unknown error")}</span>`;
        return;
      }
      if (!data.found) {
        statusEl.innerHTML = `<span class="warn">No matching records found.</span>`;
        outEl.innerHTML = "";
        try { sessionStorage.removeItem(LAST_RESULT_KEY); } catch (e) {}
        return;
      }
      if (data.multipleCustomers && Array.isArray(data.matches)) {
        statusEl.innerHTML = `<span class="info">${data.matches.length} matches found &mdash; select one:</span>`;
        renderCustomerMatches(data.matches);
        return;
      }

      const c = data.customer || {};
      statusEl.innerHTML = `<span class="ok">${esc(c.borrowerName || "")} (${esc(c.custId || "")})</span>`;
      renderLookup(data);

      try {
        sessionStorage.setItem(LAST_RESULT_KEY, JSON.stringify({ q: queryText || "", data }));
      } catch (e) {}
    }

    async function fetchLookup(queryParams, statusMessage, queryText) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");

      if (lookupCache.has(queryParams)) {
        applyLookupData(lookupCache.get(queryParams), queryText);
        return;
      }

      statusEl.innerHTML = `<span class="info">${esc(statusMessage)}</span>`;
      outEl.innerHTML = "";

      try {
        const res = await fetch(`${WEB_APP_URL}?action=lookup&${queryParams}`);
        const data = await res.json();
        if (data && data.ok) lookupCache.set(queryParams, data);
        applyLookupData(data, queryText);
      } catch (err) {
        statusEl.innerHTML = '<span class="err">Connection error.</span>';
      }
    }

    function smartLookup() {
      const inputEl = document.getElementById("searchInput");
      const parsed = parseSearchQuery(inputEl.value);

      if (!parsed) {
        document.getElementById("status").innerHTML = '<span class="err">Enter loan no. or customer name.</span>';
        inputEl.focus();
        return;
      }

      if (parsed.type === "loan") {
        inputEl.value = parsed.value;
        fetchLookup(`loanId=${encodeURIComponent(parsed.value)}`, `Loading ${parsed.value}...`, parsed.value);
      } else {
        fetchLookup(`custName=${encodeURIComponent(parsed.value)}`, `Searching "${parsed.value}"...`, parsed.value);
      }
    }

    function selectCustomerById(custId) {
      fetchLookup(`custId=${encodeURIComponent(custId)}`, `Loading ${custId}...`, custId);

      const phoneChip = telHref

        : `<span class="contact-static">${whiteWaSvg} -</span>`;

      let html = `

      const displayLoans = chronologicalLoans

          ? `
            <div class="kpi-box featured-date">
              <div class="kpi-lbl">Closed On${esc(getDayTag(closedDate))}</div>
              <div class="kpi-val">${esc(fmtDate(closedDate))}</div>
            </div>
          `
          : `
            <div class="kpi-box featured-date">
              <div class="kpi-lbl">Next Due${esc(getDayTag(loan.nextColDate))}</div>
              <div class="kpi-val">${esc(fmtDate(loan.nextColDate))}</div>
            </div>
          `;

        const secondaryMetaHtml = isLoanClosed
          ? (tenure.discount
              ? `
                <div><div class="lbl">Instalment</div><div class="val">${fmtNum(loan.instalmentAmt)}</div></div>
                <div><div class="lbl">Duration</div><div class="val">${tenure.weeksSpan !== null ? `${tenure.weeksSpan}W (${tenure.daysSpan}D)` : "-"}</div></div>
                <div><div class="lbl">Modes</div><div class="val">${esc(modeBreakdown)}</div></div>
                <div><div class="lbl">Discount</div><div class="val">${fmtNum(tenure.discount.amount)}</div></div>
              `
              : `
                <div><div class="lbl">Instalment</div><div class="val">${fmtNum(loan.instalmentAmt)}</div></div>
                <div><div class="lbl">Duration</div><div class="val">${tenure.weeksSpan !== null ? `${tenure.weeksSpan}W (${tenure.daysSpan}D)` : "-"}</div></div>
                <div><div class="lbl">Modes</div><div class="val">${esc(modeBreakdown)}</div></div>
                <div><div class="lbl">Last Collection</div><div class="val">${esc(fmtDate(latestPayDate))}</div></div>
              `)
          : `
              <div><div class="lbl">Instalment</div><div class="val">${fmtNum(loan.instalmentAmt)}</div></div>
              <div><div class="lbl">Duration</div><div class="val">${tenure.weeksSpan !== null ? `${tenure.weeksSpan}W (${tenure.daysSpan}D)` : "-"}</div></div>
              <div><div class="lbl">Modes</div><div class="val">${esc(modeBreakdown)}</div></div>
              <div><div class="lbl">Last Collection</div><div class="val">${esc(fmtDate(latestPayDate))}</div></div>
            `;

        html += `
          <div class="card ${extraCardClasses}">
            <div class="card-top">
              <h2 class="card-title">&#128179; #${loanSequenceNum} ${esc(loan.loanId || "-")}</h2>
              <div class="badges">
                <span class="tag tag-seq">${loanSequenceNum}/${chronologicalLoans.length}</span>
                <span class="tag ${statusTagClass}">${esc(loan.status || (isLoanClosed ? "CLOSED" : "ACTIVE"))}</span>
                ${tenure.badgeHtml}
                <span class="tag">${loanBadgeLabel}</span>
              </div>
            </div>

            <div class="loan-kpi-grid">
              <div class="kpi-box">
                <div class="kpi-lbl">Loan Amount</div>
                <div class="kpi-val info">${fmtNum(loan.loanAmt)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Loan Date${esc(getDayTag(loan.loanDate))}</div>
                <div class="kpi-val">${esc(fmtDate(loan.loanDate))}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Guarantor</div>
                <div class="kpi-val">${esc(guarantorDisplay)}</div>
              </div>

              <div class="kpi-box">
                <div class="kpi-lbl">1st Due${esc(getDayTag(firstDueDate))}</div>
                <div class="kpi-val">${esc(fmtDate(firstDueDate))}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Expected Close${esc(getDayTag(expectedCloseDate))}</div>
                <div class="kpi-val">${esc(fmtDate(expectedCloseDate))}</div>
              </div>
              ${sixthBoxHtml}

              <div class="kpi-box">
                <div class="kpi-lbl">Total Collected</div>
                <div class="kpi-val ok">${fmtNum(loan.totalReceived)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Pending Amount</div>
                <div class="kpi-val ${loanPending > 0 ? "err" : "ok"}">${fmtNum(loanPending)}</div>
              </div>
              <div class="kpi-box">
                <div class="kpi-lbl">Paid Weeks</div>
                <div class="kpi-val">${tenure.activeWeeks} / ${STANDARD_WEEKS} WKS</div>
              </div>
            </div>

            <div class="meta-grid-2">
              ${secondaryMetaHtml}
            </div>

            <div class="collections-header">
              <span class="collections-title">&#129534; Collections History (${payments.length})</span>
              <button
                type="button"
                class="toggle-btn"
                id="toggle-btn-${safeLoanId}"
                onclick="togglePayments('${safeLoanId}')"
              >&#9656; Expand</button>
            </div>

            <div class="payments-wrap collapsed" id="payments-wrap-${safeLoanId}">
              <table>
                <thead>
                  <tr>
                    <th class="sl-col">#</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Diff</th>
                    <th>Mode / Remarks</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      });

      document.getElementById("output").innerHTML = html;
    }

    document.getElementById("todayDateDisplay").textContent = fmtDateWithDay(new Date());

    const searchInputEl = document.getElementById("searchInput");
    searchInputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") smartLookup();
    });

    const initialParam = new URLSearchParams(window.location.search).get("q");
    if (initialParam) {
      searchInputEl.value = initialParam;
      smartLookup();
    } else {
      try {
        const cachedSession = JSON.parse(sessionStorage.getItem(LAST_RESULT_KEY) || "null");
        if (cachedSession && cachedSession.data && cachedSession.data.ok) {
          if (cachedSession.q) searchInputEl.value = cachedSession.q;
          applyLookupData(cachedSession.data, cachedSession.q);
        }
      } catch (e) {}
    }
  </script>
</body>
</html>
