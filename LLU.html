<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loan &amp; Customer Lookup</title>
  <script src="auth.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 18px 14px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: #121722;
      color: #e6edf7;
      line-height: 1.38;
    }
    .container {
      max-width: 1020px;
      margin: 0 auto;
    }

    /* Minimal Search Panel */
    .main-shell {
      background: #1b2230;
      border: 1px solid #2b3548;
      border-radius: 12px;
      padding: 16px 18px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.3);
      margin-bottom: 14px;
    }
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }
    .btn-home {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 18px;
      background-color: #2d3343;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-home:hover {
      background-color: #374151;
      color: #f8fafc;
    }
    .btn-home:active {
      transform: translateY(1px) scale(0.99);
    }
    .today-badge {
      font-size: 12px;
      font-weight: 600;
      color: #b4c0d3;
      background: #111620;
      border: 1px solid #2b3548;
      padding: 5px 10px;
      border-radius: 8px;
    }
    .today-badge span {
      color: #29b6f6;
      font-weight: 700;
    }

    .page-title-wrap {
      text-align: center;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: 19px;
      font-weight: 700;
      color: #29b6f6;
    }

    .search-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      align-items: center;
      gap: 8px;
    }
    input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #2c3649;
      background: #111620;
      color: #f1f5f9;
      font-size: 14.5px;
    }
    input::placeholder { color: #64748b; }
    input:focus {
      outline: none;
      border-color: #29b6f6;
      box-shadow: 0 0 0 2px rgba(41, 182, 246, 0.18);
    }

    button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      background: #29b6f6;
      color: #0b1320;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
    }
    button:hover { filter: brightness(1.08); }
    button.btn-secondary {
      background: #252e3f;
      color: #e6edf7;
      border: 1px solid #354158;
    }
    button.btn-secondary:hover { border-color: #29b6f6; }

    .status {
      margin-top: 9px;
      font-size: 12.5px;
      color: #94a3b8;
    }
    .err { color: #f87171; }
    .ok { color: #4ade80; }
    .info { color: #29b6f6; }
    .warn { color: #fbbf24; }
    .muted { color: #94a3b8; }

    /* Cards */
    .card {
      background: #1b2230;
      border: 1px solid #2b3548;
      border-radius: 12px;
      padding: 15px 17px;
      margin-bottom: 14px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.24);
      text-align: left;
    }
    .card.highlight {
      box-shadow: 0 0 0 1px rgba(41, 182, 246, 0.45), 0 10px 24px rgba(0, 0, 0, 0.3);
    }

    /* Customer Card */
    .customer-card {
      background: linear-gradient(160deg, #1b273b 0%, #17202e 55%, #151c28 100%);
      border: 1px solid #2e4361;
      border-top: 4px solid #38bdf8;
    }
    .customer-hero {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      padding-bottom: 12px;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      flex-wrap: wrap;
    }
    .customer-hero-main { flex: 1 1 300px; }
    .customer-name-large {
      margin: 0;
      font-size: 22px;
      font-weight: 800;
      color: #f8fafc;
      line-height: 1.22;
    }
    .customer-nickname-inline {
      font-size: 14.5px;
      font-weight: 600;
      color: #38bdf8;
      margin-left: 5px;
    }
    .customer-contact-line {
      margin-top: 6px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 12px;
      font-size: 13.5px;
      font-weight: 700;
      color: #e2e8f0;
    }
    .contact-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(15, 23, 36, 0.72);
      border: 1px solid #2c3e58;
      padding: 3px 9px;
      border-radius: 7px;
    }
    .customer-address-large {
      margin-top: 7px;
      font-size: 13.5px;
      color: #cbd5e1;
    }

    /* Compact KPI Boxes */
    .kpi-strip {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .loan-kpi-row-4 {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 8px;
    }
    .loan-kpi-row-3 {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .kpi-box {
      background: rgba(15, 23, 36, 0.78);
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 8px;
      padding: 7px 10px;
    }
    .kpi-box.featured-date {
      border-color: rgba(56, 189, 248, 0.45);
      background: rgba(14, 27, 44, 0.85);
    }
    .kpi-lbl {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #94a3b8;
      margin-bottom: 2px;
    }
    .kpi-val {
      font-size: 13.5px;
      font-weight: 700;
      color: #f8fafc;
      white-space: nowrap;
    }
    .kpi-day {
      font-size: 11.5px;
      font-weight: 600;
      color: #94a3b8;
      margin-left: 3px;
    }

    /* Loan Shades & Badges */
    .card.loan-active {
      background: linear-gradient(165deg, #162a24 0%, #14221e 100%);
      border-color: rgba(34, 197, 94, 0.45);
      border-left: 4px solid #22c55e;
    }
    .card.loan-active .kpi-box {
      background: rgba(12, 24, 20, 0.72);
      border-color: rgba(74, 222, 128, 0.24);
    }
    .card.loan-closed {
      background: linear-gradient(165deg, #20242c 0%, #191d24 100%);
      border-color: rgba(148, 163, 184, 0.32);
      border-left: 4px solid #64748b;
    }
    .card.loan-closed .kpi-box {
      background: rgba(17, 20, 26, 0.75);
      border-color: rgba(148, 163, 184, 0.22);
    }

    .tag-active {
      background: rgba(34, 197, 94, 0.16);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.45);
    }
    .tag-closed {
      background: rgba(148, 163, 184, 0.16);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.35);
    }
    .tag-seq {
      background: rgba(56, 189, 248, 0.14);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.38);
    }
    .tag-rank-a {
      background: rgba(74, 222, 128, 0.16);
      color: #4ade80;
      border: 1px solid rgba(74, 222, 128, 0.45);
    }
    .tag-rank-b {
      background: rgba(56, 189, 248, 0.16);
      color: #7dd3fc;
      border: 1px solid rgba(56, 189, 248, 0.45);
    }
    .tag-rank-c {
      background: rgba(251, 191, 36, 0.16);
      color: #fbbf24;
      border: 1px solid rgba(251, 191, 36, 0.45);
    }
    .tag-rank-d {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.55);
    }

    /* Multi-match list */
    .match-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .match-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 13px;
      border-radius: 8px;
      background: #111620;
      border: 1px solid #2c3649;
      cursor: pointer;
      flex-wrap: wrap;
    }
    .match-item:hover { border-color: #29b6f6; }
    .match-item.match-black { border-color: #ef4444; background: #27151b; }
    .match-main { font-size: 14.5px; font-weight: 700; color: #f1f5f9; }
    .match-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }

    /* Blacklist & Tenure Notes */
    .card.blacklisted {
      border: 2px solid #ef4444;
      background: linear-gradient(160deg, #2c151d 0%, #1f1116 100%);
    }
    .blacklist-banner {
      background: #dc2626;
      color: #fff;
      font-weight: 700;
      padding: 7px 10px;
      border-radius: 7px;
      margin-bottom: 12px;
      font-size: 12px;
    }
    .tag-black { background: #dc2626 !important; color: #fff !important; border: none !important; }

    .tenure-note {
      margin-top: 10px;
      padding: 7px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      background: #111620;
      border: 1px solid #2c3649;
    }
    .tenure-note.over { border-color: #f59e0b; color: #fde68a; background: rgba(245, 158, 11, 0.12); }
    .tenure-note.early-bad { border-color: #ef4444; color: #fecaca; background: rgba(239, 68, 68, 0.14); }
    .tenure-note.early-good { border-color: #c084fc; color: #f3e8ff; background: rgba(192, 132, 252, 0.12); }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 11px;
      padding-bottom: 9px;
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      flex-wrap: wrap;
    }
    .badges { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .card-title { margin: 0; font-size: 15.5px; font-weight: 700; color: #38bdf8; }
    .tag {
      background: #111620;
      color: #29b6f6;
      border: 1px solid #2c3649;
      padding: 2.5px 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .tag-amber { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.45); }
    .tag-pink { background: rgba(192, 132, 252, 0.15); color: #e9d5ff; border: 1px solid rgba(192, 132, 252, 0.45); }
    .tag-red { background: rgba(239, 68, 68, 0.18); color: #fca5a5; border: 1px solid rgba(239, 68, 68, 0.5); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 9px 12px;
    }
    .lbl { font-size: 11px; color: #94a3b8; margin-bottom: 2px; }
    .val { font-size: 13.5px; font-weight: 600; color: #f1f5f9; word-break: break-word; }

    /* Expandable Payments */
    .collections-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-top: 11px;
      padding-top: 10px;
      border-top: 1px solid rgba(148, 163, 184, 0.18);
      flex-wrap: wrap;
    }
    .collections-title {
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      color: #38bdf8;
    }
    .toggle-payments-btn {
      padding: 5px 10px;
      font-size: 11.5px;
      background: #252e3f;
      color: #e6edf7;
      border: 1px solid #354158;
      border-radius: 7px;
      cursor: pointer;
    }
    .toggle-payments-btn:hover { border-color: #29b6f6; }
    .payments-wrap { overflow-x: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
    .payments-wrap.collapsed { display: none; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
      background: #111620;
      border-radius: 8px;
      overflow: hidden;
      min-width: 460px;
    }
    th, td { text-align: left; padding: 7px 9px; border-bottom: 1px solid #232c3d; }
    th {
      color: #38bdf8;
      font-size: 11px;
      text-transform: uppercase;
      background: #161d2b;
    }
    tr:last-child td { border-bottom: none; }
    .sl-col { width: 36px; color: #94a3b8; font-weight: 700; }

    /* Mobile Compact Overrides */
    @media (max-width: 640px) {
      body { padding: 10px 8px; }
      .main-shell, .card { padding: 11px 12px; border-radius: 10px; margin-bottom: 10px; }
      h1 { font-size: 16.5px; }
      .search-row { grid-template-columns: 1fr 1fr; gap: 6px; }
      #searchInput { grid-column: 1 / -1; padding: 9px 11px; font-size: 14px; }
      .search-row button { padding: 8px 10px; font-size: 12.5px; width: 100%; }
      .customer-name-large { font-size: 18.5px; }
      .customer-nickname-inline { display: block; margin-left: 0; font-size: 13px; }
      .customer-contact-line { font-size: 12.5px; gap: 6px; }
      .customer-address-large { font-size: 12.5px; }

      .kpi-strip,
      .loan-kpi-row-4,
      .loan-kpi-row-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
      }
      .kpi-box { padding: 6px 8px; }
      .kpi-lbl { font-size: 9.5px; }
      .kpi-val { font-size: 12px; white-space: normal; }
      .kpi-day { font-size: 10.5px; }

      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px 10px; }
      .val { font-size: 12.5px; }
      .card-title { font-size: 14px; }
      .tag { padding: 2px 7px; font-size: 10px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="main-shell">
      <div class="top-nav">
        <a class="btn-home" href="index.html">&#127968; Home Dashboard</a>
        <div class="today-badge">Today: <span id="todayDateDisplay">-</span></div>
      </div>

      <div class="page-title-wrap">
        <h1>&#128269; Loan &amp; Customer Lookup</h1>
      </div>

      <div class="search-row">
        <input id="searchInput" type="text" placeholder="Loan No. (24) or Name (Madhu)" autofocus />
        <button type="button" onclick="smartLookup()">Search</button>
        <button class="btn-secondary" type="button" onclick="resetSearch()">Clear</button>
      </div>

      <div id="status" class="status">Enter loan no. or customer name.</div>
    </div>

    <div id="output"></div>
  </div>

  <script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec";
    const LOOKUP_API_KEY = "CHANGE_THIS_TO_A_PRIVATE_SECRET_KEY";

    const STANDARD_WEEKS = 10;
    const STANDARD_DAYS = STANDARD_WEEKS * 7;
    const BUFFER_DAYS = 5;
    const STANDARD_INSTALLMENTS = 10;
    const QUICK_RENEWAL_MAX_DAYS = 7;
    const MS_PER_DAY = 1000 * 60 * 60 * 24;

    const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const WEEKDAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const lookupCache = new Map();

    function parseSearchQuery(rawInput) {
      const cleaned = String(rawInput || "").trim();
      if (!cleaned) return null;

      if (/^\d+$/.test(cleaned)) {
        const num = parseInt(cleaned, 10);
        return { type: "loan", value: "SW_L" + String(num).padStart(4, "0") };
      }

      const swlMatch = cleaned.match(/^sw[_-\s]*l[\s_-]*(\d+)$/i);
      if (swlMatch) {
        const num = parseInt(swlMatch[1], 10);
        return { type: "loan", value: "SW_L" + String(num).padStart(4, "0") };
      }

      return { type: "customer", value: cleaned };
    }

    function fmtINR(num) {
      const val = Number(num) || 0;
      return "&#8377;" + val.toLocaleString("en-IN", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    function parseValidDate(val) {
      if (!val) return null;
      const d = new Date(val);
      if (isNaN(d.getTime())) return null;
      return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function addDays(dateObj, days) {
      if (!dateObj) return null;
      return new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate() + days);
    }

    function diffInDays(fromDate, toDate) {
      if (!fromDate || !toDate) return null;
      return Math.round((toDate.getTime() - fromDate.getTime()) / MS_PER_DAY);
    }

    function fmtDate(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      const day = String(d.getDate()).padStart(2, "0");
      return `${day} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    }

    function fmtDateWithDay(val) {
      const d = parseValidDate(val);
      if (!d) return val ? String(val) : "-";
      const day = String(d.getDate()).padStart(2, "0");
      return `${day} ${MONTHS[d.getMonth()]} ${d.getFullYear()} (${WEEKDAYS[d.getDay()]})`;
    }

    function fmtDateInlineDay(val) {
      const d = parseValidDate(val);
      if (!d) return esc(val ? String(val) : "-");
      const day = String(d.getDate()).padStart(2, "0");
      return `${day} ${MONTHS[d.getMonth()]} ${d.getFullYear()} <span class="kpi-day">(${WEEKDAYS[d.getDay()]})</span>`;
    }

    function esc(str) {
      return String(str ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function domIdSafe(str) {
      return String(str ?? "").replace(/[^a-zA-Z0-9_-]/g, "_");
    }

    function buildAddress(c) {
      const parts = [c.careOf, c.houseName, c.streetName, c.postOffice, c.pinCode]
        .map(x => String(x || "").trim())
        .filter(Boolean);
      return parts.length ? parts.join(", ") : "-";
    }

    function resetSearch() {
      const inputEl = document.getElementById("searchInput");
      inputEl.value = "";
      document.getElementById("output").innerHTML = "";
      document.getElementById("status").innerHTML = "Enter loan no. or customer name.";
      inputEl.focus();
    }

    function togglePayments(safeLoanId) {
      const wrap = document.getElementById(`payments-wrap-${safeLoanId}`);
      const btn = document.getElementById(`toggle-btn-${safeLoanId}`);
      if (!wrap || !btn) return;

      const isCollapsed = wrap.classList.toggle("collapsed");
      btn.innerHTML = isCollapsed ? "&#9656; Expand Collections" : "&#9662; Collapse Collections";
    }

    function sortLoansChronologically(loans) {
      return [...loans].sort((a, b) => {
        const da = parseValidDate(a.loanDate);
        const db = parseValidDate(b.loanDate);
        const na = parseInt(String(a.loanId || "").replace(/\D+/g, ""), 10) || 0;
        const nb = parseInt(String(b.loanId || "").replace(/\D+/g, ""), 10) || 0;

        if (da && db && da.getTime() !== db.getTime()) {
          return da.getTime() - db.getTime();
        }
        return na - nb;
      });
    }

    function resolveLoanPendingBalance(loan) {
      const statusUpper = String(loan.status || "").trim().toUpperCase();
      if (statusUpper === "CLOSED") return 0;

      const loanAmt = Number(loan.loanAmt) || 0;
      const totalReceived = Number(loan.totalReceived) || 0;
      const rawPending = Number(loan.pendingAmt);

      if (rawPending > 0) return rawPending;
      return Math.max(0, loanAmt - totalReceived);
    }

    function summarizePaymentModes(payments) {
      let upi = 0;
      let cash = 0;
      let other = 0;

      (payments || []).forEach(p => {
        const r = String(p.remarks || "").trim().toUpperCase();
        if (!r) return;
        if (r.includes("UPI")) upi += 1;
        else if (r.includes("CASH")) cash += 1;
        else other += 1;
      });

      const parts = [];
      if (upi > 0) parts.push(`UPI: ${upi}`);
      if (cash > 0) parts.push(`Cash: ${cash}`);
      if (other > 0) parts.push(`Other: ${other}`);

      return parts.length ? parts.join(" \u2022 ") : "-";
    }

    function resolveFirstCollectionDate(loan) {
      const explicitFirst =
        parseValidDate(loan.firstColDate) ||
        parseValidDate(loan.firstCollectionDate) ||
        parseValidDate(loan.firstDueDate) ||
        parseValidDate(loan.dueDate);

      if (explicitFirst) return explicitFirst;

      const loanDate = parseValidDate(loan.loanDate);
      if (!loanDate) return null;

      let firstDue = addDays(loanDate, 7);

      const nextCol = parseValidDate(loan.nextColDate);
      if (nextCol) {
        const targetDay = nextCol.getDay();
        const currentDay = firstDue.getDay();
        if (targetDay !== currentDay) {
          let shift = targetDay - currentDay;
          if (shift < -3) shift += 7;
          if (shift > 3) shift -= 7;
          firstDue = addDays(firstDue, shift);
        }
      }

      return firstDue;
    }

    function resolveLoanClosedDate(loan) {
      const explicitClose =
        parseValidDate(loan.closedDate) ||
        parseValidDate(loan.closeDate) ||
        (loan.earlyClosingDiscount && parseValidDate(loan.earlyClosingDiscount.date)) ||
        null;

      let latestPaymentDate = null;
      (loan.payments || []).forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (pd && (!latestPaymentDate || pd.getTime() > latestPaymentDate.getTime())) {
          latestPaymentDate = pd;
        }
      });

      if (latestPaymentDate && explicitClose) {
        return latestPaymentDate.getTime() >= explicitClose.getTime() ? latestPaymentDate : explicitClose;
      }
      return latestPaymentDate || explicitClose;
    }

    function resolveExpectedCloseDate(loan, firstDueDate) {
      const baseDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);
      if (!baseDue) return null;
      return addDays(baseDue, (STANDARD_INSTALLMENTS - 1) * 7);
    }

    function computePaymentRows(loan, firstDueDate) {
      const payments = loan.payments || [];
      const instAmt = Number(loan.instalmentAmt) || 0;
      const loanAmt = Number(loan.loanAmt) || 0;
      const anchorFirstDue = firstDueDate || addDays(parseValidDate(loan.loanDate), 7);

      let cycleIndex = 0;
      let cycleAccumulated = 0;
      let cycleStarted = false;
      let cumulativePaid = 0;
      let prevPayDate = null;

      return payments.map((p, idx) => {
        const amt = Number(p.amtRcvd) || 0;
        const actual = parseValidDate(p.cltnDate);

        if (!actual) {
          return {
            index: idx,
            cltnDate: p.cltnDate,
            amtRcvd: amt,
            remarks: p.remarks,
            diffText: "-",
            diffCls: "muted",
            dayDiffNum: null
          };
        }

        const alreadySettledBeforeThis = loanAmt > 0 && cumulativePaid >= loanAmt;
        const isSameDayAsPrev = prevPayDate && diffInDays(prevPayDate, actual) === 0;

        cumulativePaid += amt;

        const isPartOfOngoingCycle = cycleStarted && instAmt > 0 && cycleAccumulated < instAmt;

        let diffText = "-";
        let diffCls = "muted";
        let dayDiffNum = null;

        if (isPartOfOngoingCycle) {
          cycleAccumulated += amt;
          const isCompletedNow = cycleAccumulated >= instAmt;
          diffText = isCompletedNow ? "Part (Done)" : "Part (Due)";
          diffCls = isCompletedNow ? "ok" : "warn";

          if (isCompletedNow) {
            cycleIndex += 1;
            cycleAccumulated = 0;
            cycleStarted = false;
          }
        } else if (alreadySettledBeforeThis || (isSameDayAsPrev && cycleIndex > 0 && amt < instAmt)) {
          diffText = "Nil";
          diffCls = "muted";
        } else {
          const scheduledDue = addDays(anchorFirstDue, cycleIndex * 7);
          const days = scheduledDue ? diffInDays(scheduledDue, actual) : null;

          if (days === null) {
            diffText = "-";
            diffCls = "muted";
          } else if (days < 0 && alreadySettledBeforeThis) {
            diffText = "Nil";
            diffCls = "muted";
          } else {
            dayDiffNum = days;
            diffText = `${days} ${Math.abs(days) === 1 ? "day" : "days"}`;
            diffCls = days <= 0 ? "ok" : (days <= 2 ? "warn" : "err");
          }

          if (instAmt > 0 && amt < instAmt) {
            cycleAccumulated = amt;
            cycleStarted = true;
          } else {
            cycleIndex += 1;
            cycleAccumulated = 0;
            cycleStarted = false;
          }
        }

        prevPayDate = actual;

        return {
          index: idx,
          cltnDate: p.cltnDate,
          amtRcvd: amt,
          remarks: p.remarks,
          diffText,
          diffCls,
          dayDiffNum
        };
      });
    }

    function countDistinctPaymentWeeks(payments, startDate) {
      const buckets = new Set();
      payments.forEach(p => {
        const pd = parseValidDate(p.cltnDate);
        if (!pd) return;
        const base = startDate || pd;
        const diffDays = Math.max(0, Math.floor((pd.getTime() - base.getTime()) / MS_PER_DAY));
        buckets.add(Math.floor(diffDays / 7));
      });
      return buckets.size;
    }

    function findNextLoanAfter(currentLoan, closeDate, allLoans) {
      const curDate = parseValidDate(currentLoan.loanDate);
      const curNum = parseInt(String(currentLoan.loanId || "").replace(/\D+/g, ""), 10) || 0;

      let earliestNext = null;

      allLoans.forEach(other => {
        if (other.loanId === currentLoan.loanId) return;
        const otherDate = parseValidDate(other.loanDate);
        const otherNum = parseInt(String(other.loanId || "").replace(/\D+/g, ""), 10) || 0;

        let isAfter = false;
        if (curDate && otherDate) {
          if (otherDate.getTime() > curDate.getTime()) isAfter = true;
          else if (otherDate.getTime() === curDate.getTime() && otherNum > curNum) isAfter = true;
        } else {
          isAfter = otherNum > curNum;
        }

        if (isAfter) {
          if (!earliestNext) {
            earliestNext = { loan: other, date: otherDate };
          } else if (earliestNext.date && otherDate && otherDate.getTime() < earliestNext.date.getTime()) {
            earliestNext = { loan: other, date: otherDate };
          }
        }
      });

      if (!earliestNext) return null;

      let daysAfterClose = null;
      if (closeDate && earliestNext.date) {
        daysAfterClose = Math.round((earliestNext.date.getTime() - closeDate.getTime()) / MS_PER_DAY);
      }

      return {
        loanId: earliestNext.loan.loanId,
        loanAmt: Number(earliestNext.loan.loanAmt) || 0,
        loanDate: earliestNext.date,
        daysAfterClose: daysAfterClose
      };
    }

    function evaluateLoanTenure(loan, allLoans) {
      const payments = loan.payments || [];
      const rawEntryCount = payments.length;
      const statusUpper = String(loan.status || "").trim().toUpperCase();
      const isClosed = statusUpper === "CLOSED";

      const startDate = parseValidDate(loan.loanDate);
      const endDate = isClosed ? resolveLoanClosedDate(loan) : null;

      const discount = loan.earlyClosingDiscount && Number(loan.earlyClosingDiscount.amount) > 0
        ? loan.earlyClosingDiscount
        : null;

      const daysSpan = (startDate && endDate)
        ? Math.max(0, Math.round((endDate.getTime() - startDate.getTime()) / MS_PER_DAY))
        : null;

      const weeksSpan = daysSpan !== null ? Number((daysSpan / 7).toFixed(1)) : null;
      const activeWeeks = countDistinctPaymentWeeks(payments, startDate);

      if (!isClosed) {
        return {
          rawEntryCount,
          activeWeeks,
          weeksSpan,
          daysSpan,
          endDate,
          discount,
          isQuickHigherRenewal: false,
          isOverStandard: false,
          badgeHtml: "",
          noteHtml: ""
        };
      }

      const maxAllowedDays = STANDARD_DAYS + BUFFER_DAYS;
      const isOverStandard = daysSpan !== null && daysSpan > maxAllowedDays;
      const isEarlyClose = (daysSpan !== null && daysSpan < STANDARD_DAYS) || (activeWeeks > 0 && activeWeeks < STANDARD_INSTALLMENTS);

      const nextLoanInfo = findNextLoanAfter(loan, endDate, allLoans);
      const currentLoanAmt = Number(loan.loanAmt) || 0;
      const takenWithin7Days = Boolean(
        nextLoanInfo &&
        nextLoanInfo.daysAfterClose !== null &&
        nextLoanInfo.daysAfterClose >= 0 &&
        nextLoanInfo.daysAfterClose <= QUICK_RENEWAL_MAX_DAYS
      );
      const hasHigherAmount = Boolean(nextLoanInfo && nextLoanInfo.loanAmt > currentLoanAmt);
      const isQuickHigherRenewal = Boolean(isEarlyClose && takenWithin7Days && hasHigherAmount);

      const discountText = discount ? ` (Discount: ${fmtINR(discount.amount)})` : "";
      const nextLoanGapText = nextLoanInfo
        ? (nextLoanInfo.daysAfterClose !== null
            ? `Next loan ${nextLoanInfo.loanId} (${fmtINR(nextLoanInfo.loanAmt)}) taken ${nextLoanInfo.daysAfterClose}d after close`
            : `Next loan ${nextLoanInfo.loanId} (${fmtINR(nextLoanInfo.loanAmt)}) taken`)
        : "No follow-up loan";

      let badgeHtml = "";
      let noteHtml = "";

      if (isQuickHigherRenewal) {
        badgeHtml = `<span class="tag tag-red">Black Mark &bull; Early + Higher (&le;7d)</span>`;
        noteHtml = `<div class="tenure-note early-bad">&#9888;&#65039; Early close (${weeksSpan ?? "-"}w / ${rawEntryCount} pmts)${discountText} + ${nextLoanGapText} &mdash; Flagged.</div>`;
      } else if (isEarlyClose) {
        badgeHtml = `<span class="tag tag-pink">Early Close &bull; Good${discount ? " + Disc" : ""}</span>`;
        noteHtml = `<div class="tenure-note early-good">&#8505;&#65039; Early close (${weeksSpan ?? "-"}w / ${rawEntryCount} pmts)${discountText} &mdash; ${nextLoanGapText}.</div>`;
      } else if (isOverStandard) {
        badgeHtml = `<span class="tag tag-amber">Over Tenure (${weeksSpan ?? "-"}w)</span>`;
        noteHtml = `<div class="tenure-note over">&#9888;&#65039; Past 10w + 5d (${maxAllowedDays}d): ${daysSpan ?? "-"}d (${weeksSpan ?? "-"}w) across ${activeWeeks}w.</div>`;
      } else if (discount) {
        badgeHtml = `<span class="tag tag-pink">Discount: ${fmtINR(discount.amount)}</span>`;
        noteHtml = `<div class="tenure-note early-good">&#8505;&#65039; ${esc(discount.remarks)}: ${fmtINR(discount.amount)}.</div>`;
      }

      return {
        rawEntryCount,
        activeWeeks,
        weeksSpan,
        daysSpan,
        endDate,
        discount,
        isQuickHigherRenewal,
        isOverStandard,
        badgeHtml,
        noteHtml
      };
    }

    function scorePaymentDayDiff(days) {
      if (days <= 0) return 5;
      if (days <= 2) return 2;
      if (days <= 7) return 1;
      return -1;
    }

    function computeCustomerScore(customer, orderedLoans) {
      const isBlacklisted = String(customer.status || "").trim().toUpperCase().includes("BLACK");
      if (isBlacklisted) {
        return { score: 0, rank: "D", rankLabel: "Black Listed", badgeCls: "tag-rank-d", reason: "Black Listed" };
      }

      if (!orderedLoans.length) {
        return { score: 65, rank: "B", rankLabel: "New", badgeCls: "tag-rank-b", reason: "No loans yet" };
      }

      let totalPaymentPoints = 0;
      let scoredPaymentsCount = 0;
      let loanAdjustments = 0;
      let hasQuickHigherRenewal = false;

      orderedLoans.forEach(loan => {
        const firstDue = resolveFirstCollectionDate(loan);
        const rows = computePaymentRows(loan, firstDue);
        rows.forEach(r => {
          if (typeof r.dayDiffNum === "number") {
            totalPaymentPoints += scorePaymentDayDiff(r.dayDiffNum);
            scoredPaymentsCount += 1;
          }
        });

        const tenure = evaluateLoanTenure(loan, orderedLoans);
        const isClosed = String(loan.status || "").trim().toUpperCase() === "CLOSED";
        const pending = resolveLoanPendingBalance(loan);

        if (isClosed && pending <= 0) loanAdjustments += 4;
        if (tenure.isOverStandard) loanAdjustments -= 8;
        if (tenure.isQuickHigherRenewal) {
          hasQuickHigherRenewal = true;
          loanAdjustments -= 25;
        }
      });

      const avgPts = scoredPaymentsCount > 0 ? totalPaymentPoints / scoredPaymentsCount : 2;
      const normalizedPaymentScore = Math.max(0, Math.min(65, ((avgPts + 1) / 6) * 65));

      let rawScore = Math.round(25 + normalizedPaymentScore + loanAdjustments);
      rawScore = Math.max(0, Math.min(100, rawScore));

      if (hasQuickHigherRenewal && rawScore > 49) rawScore = 49;

      let rank = "B", rankLabel = "Good", badgeCls = "tag-rank-b";
      if (rawScore >= 80) { rank = "A"; rankLabel = "Prime"; badgeCls = "tag-rank-a"; }
      else if (rawScore >= 60) { rank = "B"; rankLabel = "Good"; badgeCls = "tag-rank-b"; }
      else if (rawScore >= 40) { rank = "C"; rankLabel = "Caution"; badgeCls = "tag-rank-c"; }
      else { rank = "D"; rankLabel = "Risk"; badgeCls = "tag-rank-d"; }

      return {
        score: rawScore,
        rank,
        rankLabel,
        badgeCls,
        reason: scoredPaymentsCount > 0
          ? `Avg ${avgPts.toFixed(1)} pts (${scoredPaymentsCount} pmts)`
          : "Loan history"
      };
    }

    function applyLookupData(data) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");

      if (!data.ok) {
        statusEl.innerHTML = `<span class="err">${esc(data.error || "Unknown error")}</span>`;
        return;
      }

      if (!data.found) {
        statusEl.innerHTML = `<span class="warn">No matching records found.</span>`;
        outEl.innerHTML = "";
        return;
      }

      if (data.multipleCustomers && Array.isArray(data.matches)) {
        statusEl.innerHTML = `<span class="info">${data.matches.length} matches found &mdash; select one:</span>`;
        renderCustomerMatches(data.matches);
        return;
      }

      const c = data.customer || {};
      statusEl.innerHTML = `<span class="ok">${esc(c.borrowerName || "")} (${esc(c.custId || "")})</span>`;
      renderLookup(data);
    }

    async function fetchLookup(queryParams, statusMessage) {
      const statusEl = document.getElementById("status");
      const outEl = document.getElementById("output");
      const cacheKey = queryParams;

      if (lookupCache.has(cacheKey)) {
        applyLookupData(lookupCache.get(cacheKey));
        return;
      }

      statusEl.innerHTML = `<span class="info">${esc(statusMessage)}</span>`;
      outEl.innerHTML = "";

      try {
        const url = `${WEB_APP_URL}?action=lookup&${queryParams}&key=${encodeURIComponent(LOOKUP_API_KEY)}`;
        const res = await fetch(url);
        const data = await res.json();
        if (data && data.ok) lookupCache.set(cacheKey, data);
        applyLookupData(data);
      } catch (err) {
        statusEl.innerHTML = '<span class="err">Connection error.</span>';
      }
    }

    function smartLookup() {
      const inputEl = document.getElementById("searchInput");
      const parsed = parseSearchQuery(inputEl.value);

      if (!parsed) {
        document.getElementById("status").innerHTML = '<span class="err">Enter loan no. or customer name.</span>';
        inputEl.focus();
        return;
      }

      if (parsed.type === "loan") {
        inputEl.value = parsed.value;
        fetchLookup(`loanId=${encodeURIComponent(parsed.value)}`, `Loading ${parsed.value}...`);
      } else {
        fetchLookup(`custName=${encodeURIComponent(parsed.value)}`, `Searching "${parsed.value}"...`);
      }
    }

              <div><div class="lbl">Payments / Wks</div><div class="val">${tenure.rawEntryCount} (${tenure.activeWeeks}w)</div></div>
              <div><div class="lbl">Duration</div><div class="val">${tenure.weeksSpan !== null ? `${tenure.weeksSpan}w (${tenure.daysSpan}d)` : "-"}</div></div>
              ${!isLoanClosed ? `<div><div class="lbl">Next Due</div><div class="val">${esc(fmtDateWithDay(loan.nextColDate))}</div></div>` : ""}
              <div><div class="lbl">Modes</div><div class="val">${esc(modeBreakdown)}</div></div>
              <div><div class="lbl">Status</div><div class="val">${esc(loan.status || "-")}</div></div>
            </div>

            ${tenure.noteHtml}

            <div class="collections-header">
              <span class="collections-title">&#129534; Collections (${payments.length})</span>
              <button
                type="button"
                class="toggle-payments-btn"
                id="toggle-btn-${safeLoanId}"
                onclick="togglePayments('${safeLoanId}')"
              >&#9656; Expand Collections</button>
            </div>

            <div class="payments-wrap collapsed" id="payments-wrap-${safeLoanId}">
              <table>
                <thead>
                  <tr>
                    <th class="sl-col">#</th>
                    <th>Date</th>
                    <th>Amount</th>
                    <th>Diff</th>
                    <th>Mode / Remarks</th>
                  </tr>
                </thead>
                <tbody>${rowsHtml}</tbody>
              </table>
            </div>
          </div>
        `;
      });

      document.getElementById("output").innerHTML = html;
    }

    document.getElementById("todayDateDisplay").textContent = fmtDateWithDay(new Date());

    const searchInputEl = document.getElementById("searchInput");
    searchInputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") smartLookup();
    });

    const initialParam = new URLSearchParams(window.location.search).get("q");
    if (initialParam) {
      searchInputEl.value = initialParam;
      smartLookup();
    }
  </script>
</body>
</html>
