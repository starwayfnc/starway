<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Guarantor Registration</title>
  <link rel="icon" href="favicon.ico" type="image/x-icon">
  <script src="auth.js"></script>
  <style>
    :root {
      --bg-page: #15191e;
      --bg-card: #1e232a;
      --bg-elevated: #242b33;
      --border-subtle: #2b323b;
      --accent: #00bcd4;
      --accent-hover: #38bdf8;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --danger: #f43f5e;
      --page-max-width: 480px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 24px 16px;
    }

    .card {
      background-color: var(--bg-card);
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: var(--page-max-width);
      border: 1px solid var(--border-subtle);
    }

    .home-btn-container {
      margin-bottom: 16px;
      text-align: left;
    }

    .home-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 16px;
      background-color: var(--bg-page);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }

    .home-btn:hover {
      background-color: var(--bg-elevated);
      color: var(--accent-hover);
      border-color: var(--accent);
    }

    .home-btn:active {
      transform: translateY(1px);
    }

    h2 {
      margin-top: 0;
      color: var(--accent);
      text-align: center;
      margin-bottom: 20px;
      font-size: 20px;
      font-weight: 700;
    }

    .section-divider {
      border: 0;
      border-top: 1px solid var(--border-subtle);
      margin: 20px 0 16px 0;
    }

    .section-title {
      color: var(--accent);
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text-muted);
      font-size: 13px;
    }

    input, select {
      width: 100%;
      padding: 10px 12px;
      background-color: var(--bg-page);
      border: 1px solid var(--border-subtle);
      border-radius: 10px;
      font-size: 14px;
      color: var(--text-main);
    }

    input::placeholder {
      color: #64748b;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(0, 188, 212, 0.2);
    }

    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    button[type="submit"], button[type="button"].clear-btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button[type="submit"] {
      background-color: var(--accent);
      color: #0b1320;
    }

    button[type="submit"]:hover {
      background-color: var(--accent-hover);
    }

    button[type="button"].clear-btn {
      background-color: var(--bg-page);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
    }

    button[type="button"].clear-btn:hover {
      background-color: var(--bg-elevated);
      border-color: var(--accent);
      color: var(--text-main);
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }

    .success { color: #4ade80; }
    .error { color: var(--danger); }

    @media (max-width: 460px) {
      body { padding: 16px 12px; }
      .card { padding: 18px; }
      .form-row { flex-direction: column; gap: 0; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="home-btn-container">
    <a class="home-btn" href="index.html">&#127968; Home Dashboard</a>
  </div>

  <h2>&#129309; New Guarantor Registration</h2>

  <form id="guarantorForm">
    <div class="form-group">
      <label for="joinDate">Join Date</label>
      <input type="date" id="joinDate" required>
    </div>

    <div class="form-group">
      <label for="guarantorName">Guarantor Full Name as per Aadhaar</label>
      <input type="text" id="guarantorName" required placeholder="Enter exact name as per Aadhaar">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="phoneNum">Phone Number</label>
        <input type="tel" id="phoneNum" required maxlength="10" placeholder="e.g., 9876543210">
      </div>

      <div class="form-group">
        <label for="waNumber">WA Number (Optional)</label>
        <input type="tel" id="waNumber" maxlength="10" placeholder="If different">
      </div>
    </div>

    <div class="form-group">
      <label for="aadhaar">Cust. Aadhaar (12 digits)</label>
      <input type="text" id="aadhaar" required maxlength="14" placeholder="XXXX XXXX XXXX">
    </div>

    <hr class="section-divider">
    <div class="section-title">&#128205; Address Details</div>

    <div class="form-group">
      <label for="careOf">Address Care off (C/O, W/O, S/O)</label>
      <input type="text" id="careOf" placeholder="e.g., S/O Rajan or W/O Suresh">
    </div>

    <div class="form-group">
      <label for="houseName">House Name</label>
      <input type="text" id="houseName" required placeholder="Enter House Name">
    </div>

    <div class="form-row">
      <div class="form-group">
        <label for="postOffice">Post Office</label>
        <input type="text" id="postOffice" required placeholder="e.g., Peringottukara">
      </div>

      <div class="form-group">
        <label for="pinCode">Pin Code</label>
        <input type="tel" id="pinCode" required maxlength="6" placeholder="e.g., 680565">
      </div>
    </div>

    <div class="form-group">
      <label for="nickName">Nick Name / Identity</label>
      <input type="text" id="nickName" placeholder="Optional identifier (e.g., Shop, Alias)">
    </div>

    <div class="btn-row">
      <button type="button" class="clear-btn" onclick="resetGuarantorForm()">Clear</button>
      <button type="submit" id="submitBtn">Save Guarantor</button>
    </div>
  </form>

  <div id="status"></div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec";

  function getTodayLocalIso() {
    const now = new Date();
    const offset = now.getTimezoneOffset() * 60000;
    return new Date(now - offset).toISOString().split('T')[0];
  }

  function resetGuarantorForm() {
    document.getElementById('guarantorForm').reset();
    document.getElementById('joinDate').value = getTodayLocalIso();
    document.getElementById('status').innerText = "";
  }

  document.getElementById('joinDate').value = getTodayLocalIso();

  document.getElementById('aadhaar').addEventListener('input', function () {
    let val = this.value.replace(/\D/g, '').substring(0, 12);
    let parts = [];
    for (let i = 0; i < val.length; i += 4) {
      parts.push(val.substring(i, i + 4));
    }
    this.value = parts.join(' ');
  });

  document.getElementById('pinCode').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').substring(0, 6);
  });

  document.getElementById('guarantorForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const status = document.getElementById('status');
    status.innerText = "";

    const phoneVal = document.getElementById('phoneNum').value.trim();
    const phoneRegex = /^[6-9]\d{9}$/;
    if (!phoneRegex.test(phoneVal)) {
      status.className = "error";
      status.innerText = "Please enter a valid 10-digit Indian phone number.";
      return;
    }

    const aadhaarVal = document.getElementById('aadhaar').value.replace(/\s/g, '');
    if (aadhaarVal.length !== 12 || isNaN(aadhaarVal)) {
      status.className = "error";
      status.innerText = "Aadhaar number must be exactly 12 digits.";
      return;
    }

    const pinVal = document.getElementById('pinCode').value.trim();
    if (!/^\d{6}$/.test(pinVal)) {
      status.className = "error";
      status.innerText = "Please enter a valid 6-digit Pin Code.";
      return;
    }

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Saving...";

    const payload = {
      type: "guarantor",
      joinDate: document.getElementById('joinDate').value,
      guarantorName: document.getElementById('guarantorName').value.trim(),
      phoneNum: phoneVal,
      waNumber: document.getElementById('waNumber').value.trim(),
      aadhaar: document.getElementById('aadhaar').value,
      careOf: document.getElementById('careOf').value.trim(),
      houseName: document.getElementById('houseName').value.trim(),
      postOffice: document.getElementById('postOffice').value.trim(),
      pinCode: pinVal,
      nickName: document.getElementById('nickName').value.trim()
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      status.className = "success";
      status.innerText = "Guarantor successfully registered!";
      localStorage.removeItem('nce_cached_guarantors');
      document.getElementById('guarantorForm').reset();
      document.getElementById('joinDate').value = getTodayLocalIso();
    })
    .catch(err => {
      console.error(err);
      status.className = "error";
      status.innerText = "Failed to register guarantor.";
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Save Guarantor";
    });
  });
</script>

</body>
</html>
