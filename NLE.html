<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Loan Entry</title>
  <script src="auth.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1a1d24;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px 14px;
      box-sizing: border-box;
      color: #e2e8f0;
    }
    .card {
      background: #222632;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
      width: 100%;
      max-width: 480px;
      border: 1px solid #2d3343;
      box-sizing: border-box;
    }
    .home-btn-container {
      display: flex;
      margin-bottom: 10px;
    }
    .home-btn {
      padding: 12px 18px;
      background-color: #2d3343;
      color: #94a3b8;
      border: 1px solid #475569;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .home-btn:hover {
      background-color: #374151;
      color: #f8fafc;
    }
    .home-btn:active {
      transform: translateY(1px) scale(0.99);
    }
    h2 {
      margin-top: 0;
      color: #38bdf8;
      text-align: center;
      margin-bottom: 20px;
      font-size: 22px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: 600;
      margin-bottom: 5px;
      color: #94a3b8;
      font-size: 13px;
    }
    input, select {
      width: 100%;
      padding: 10px 12px;
      background-color: #181b22;
      border: 1px solid #334155;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
      color: #f8fafc;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #38bdf8;
    }
    input[type="date"]::-webkit-calendar-picker-indicator {
      filter: invert(1);
      cursor: pointer;
    }
    .amount-row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }
    .quick-btn {
      flex: 1;
      padding: 8px 4px;
      background-color: #181b22;
      color: #38bdf8;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .quick-btn:hover {
      background-color: #282e3d;
      border-color: #38bdf8;
    }
    .action-btn-row {
      display: flex;
      gap: 8px;
      margin-top: 6px;
    }
    .action-sm-btn {
      padding: 6px 12px;
      background-color: #1e222d;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .action-sm-btn:hover {
      background-color: #282e3d;
      color: #f8fafc;
    }
    .btn-row {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    button[type="submit"], button[type="button"].clear-main {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }
    button[type="submit"] {
      background-color: #38bdf8;
      color: #0f172a;
    }
    button[type="submit"]:hover {
      background-color: #0ea5e9;
    }
    button[type="button"].clear-main {
      background-color: #2d3343;
      color: #94a3b8;
      border: 1px solid #475569;
    }
    button[type="button"].clear-main:hover {
      background-color: #374151;
      color: #f8fafc;
    }
    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    #status {
      margin-top: 15px;
      text-align: center;
      font-weight: 600;
      font-size: 14px;
    }
    .success { color: #4ade80; }
    .error { color: #f87171; }

    /* Instant WhatsApp Approval Card */
    .wa-receipt-card {
      display: none;
      margin-top: 16px;
      background: #132a1c;
      border: 1px solid #25D366;
      border-radius: 10px;
      padding: 14px;
    }
    .wa-receipt-card.visible {
      display: block;
    }
    .wa-receipt-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .wa-receipt-title {
      font-size: 13px;
      font-weight: 700;
      color: #4ade80;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .wa-receipt-preview {
      background: #0f1f15;
      border: 1px solid #1f472e;
      border-radius: 6px;
      padding: 10px;
      font-size: 13px;
      color: #e2e8f0;
      white-space: pre-line;
      line-height: 1.45;
      margin-bottom: 12px;
    }
    .wa-send-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      background-color: #25D366;
      color: #091e12;
      font-weight: 800;
      font-size: 14px;
      border-radius: 8px;
      text-decoration: none;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .wa-send-btn:hover {
      background-color: #4ade80;
    }
    .wa-send-btn.sent {
      background-color: #1e3a29;
      color: #86efac;
      border: 1px solid #22c55e;
    }
    .wa-send-btn.disabled {
      background-color: #3f3f46;
      color: #a1a1aa;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="home-btn-container">
    <button type="button" class="home-btn" onclick="window.location.href='index.html'">&#127968; Home Dashboard</button>
  </div>
  <br>
  <h2>&#128202; New Loan Entry</h2>

  <form id="loanForm">
    <div class="form-group">
      <label for="customerSelect">Select Customer</label>
      <select id="customerSelect" required>
        <option value="">-- Loading Customers... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="guarantorSelect">Select Guarantor</label>
      <select id="guarantorSelect" required>
        <option value="">-- Loading Guarantors... --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="loanDate">Loan Date</label>
      <input type="date" id="loanDate" required>
    </div>

    <div class="form-group">
      <label for="loanAmount">Loan Amount</label>
      <input type="number" step="0.01" id="loanAmount" required placeholder="Enter or add amount">

      <!-- Quick Add Amount Buttons -->
      <div class="amount-row">
        <button type="button" class="quick-btn" onclick="addAmount(5000)">+5,000</button>
        <button type="button" class="quick-btn" onclick="addAmount(10000)">+10,000</button>
        <button type="button" class="quick-btn" onclick="addAmount(15000)">+15,000</button>
        <button type="button" class="quick-btn" onclick="addAmount(20000)">+20,000</button>
      </div>
      <div class="action-btn-row">
        <button type="button" class="action-sm-btn" onclick="resetAmount()">Reset</button>
        <button type="button" class="action-sm-btn" onclick="clearAmount()">Clear</button>
      </div>
    </div>

    <div class="form-group">
      <label for="firstColDate">1st Collection Date</label>
      <input type="date" id="firstColDate" required>
    </div>

    <div class="form-group">
      <label for="paymentMode">Payment Mode</label>
      <select id="paymentMode" required>
        <option value="UPI">UPI</option>
        <option value="Cash">Cash</option>
      </select>
    </div>

    <div class="form-group">
      <label for="disbursalRef">Disbursal Ref (Optional)</label>
      <input type="text" id="disbursalRef" placeholder="Transaction reference / UTR number">
    </div>

    <div class="btn-row">
      <button type="button" class="clear-main" onclick="resetForm()">Clear</button>
      <button type="submit" id="submitBtn">Save Loan</button>
    </div>
  </form>

  <div id="status"></div>

  <!-- Instant WhatsApp Approval Card -->
  <div id="waReceiptCard" class="wa-receipt-card">
    <div class="wa-receipt-header">
      <span class="wa-receipt-title">&#128172; WhatsApp Confirmation Ready</span>
    </div>
    <div id="waReceiptPreview" class="wa-receipt-preview"></div>
    <a id="waSendBtn" class="wa-send-btn" href="#" target="_blank" rel="noopener">Send WA Confirmation</a>
  </div>
</div>

<script>
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwOXSqV7odExw90aOMLG2dVq-t6P6JAl6BBDzTlF2Ybxdokr3zXP7Q7D5b_ZIDEz_SZIA/exec";

  let customersData = [];
  let guarantorsData = [];
  let baseAmount = 0;

  function toLocalIsoDate(dateObj) {
    const offset = dateObj.getTimezoneOffset() * 60000;
    return new Date(dateObj - offset).toISOString().split('T')[0];
  }

  function formatCleanNumber(num) {
    const val = Number(num) || 0;
    return val % 1 === 0
      ? val.toLocaleString('en-IN')
      : val.toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function formatDueDateParts(isoDateStr) {
    const parts = String(isoDateStr || "").split('-');
    if (parts.length !== 3) return { dueStr: isoDateStr, fullDay: "" };

    const d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    const shortDays = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
    const fullDays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
    const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

    const dayNum = String(d.getDate()).padStart(2, '0');
    const dueStr = `${shortDays[d.getDay()]}, ${dayNum} ${months[d.getMonth()]} ${d.getFullYear()}`;
    return { dueStr, fullDay: fullDays[d.getDay()] };
  }

  function buildWaUrl(mobile, message) {
    const digits = String(mobile || "").replace(/\D/g, "").replace(/^00/, "");
    if (!digits) return "#";
    const phone = digits.length === 10 ? "91" + digits : digits;
    return `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;
  }

  function buildLoanApprovalMessage(customerName, loanAmt, firstColIso, paymentMode) {
    const amtNum = parseFloat(loanAmt) || 0;
    const instNum = amtNum / 10;
    const { dueStr, fullDay } = formatDueDateParts(firstColIso);

    return (
      `Dear ${customerName},\n\n` +
      `Loan approved and money sent via ${paymentMode}.\n` +
      `Loan Amount: INR ${formatCleanNumber(amtNum)}\n` +
      `First Due Date: ${dueStr}\n` +
      `Collection Amount: ${formatCleanNumber(instNum)}\n` +
      `Collection Day: Every ${fullDay}\n\n` +
      `Thank you for choosing Starway!`
    );
  }

  function showLoanApprovalCard(customer, message) {
    const card = document.getElementById('waReceiptCard');
    const preview = document.getElementById('waReceiptPreview');
    const btn = document.getElementById('waSendBtn');

    preview.textContent = message;

    const mobile = customer ? (customer.mobileNum || "") : "";
    const hasPhone = Boolean(String(mobile).replace(/\D/g, ""));

    if (hasPhone) {
      btn.href = buildWaUrl(mobile, message);
      btn.className = "wa-send-btn";
      btn.textContent = `Send WA Message to ${customer.name}`;
      btn.onclick = function() {
        btn.classList.add('sent');
        btn.textContent = `Sent to ${customer.name} ✓`;
      };
    } else {
      btn.href = "#";
      btn.className = "wa-send-btn disabled";
      btn.textContent = "No Mobile Number Found";
      btn.onclick = null;
    }

    card.classList.add('visible');
  }

  function setInitialDates() {
    const today = new Date();
    document.getElementById('loanDate').value = toLocalIsoDate(today);

    const nextWeek = new Date(today);
    nextWeek.setDate(today.getDate() + 7);
    document.getElementById('firstColDate').value = toLocalIsoDate(nextWeek);
  }

  setInitialDates();

  document.getElementById('loanDate').addEventListener('change', function() {
    if (this.value) {
      const parts = this.value.split('-');
      const loanD = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
      loanD.setDate(loanD.getDate() + 7);
      document.getElementById('firstColDate').value = toLocalIsoDate(loanD);
    }
  });

  function addAmount(val) {
    const current = parseFloat(document.getElementById('loanAmount').value) || 0;
    document.getElementById('loanAmount').value = current + val;
  }

  function resetAmount() {
    document.getElementById('loanAmount').value = baseAmount;
  }

  function clearAmount() {
    baseAmount = 0;
    document.getElementById('loanAmount').value = '';
  }

  function resetForm() {
    document.getElementById('loanForm').reset();
    setInitialDates();
    baseAmount = 0;
    document.getElementById('status').innerText = "";
  }

  function populateCustomerDropdown(customers) {
    customersData = customers || [];
    const cSelect = document.getElementById('customerSelect');
    const currentCustId = cSelect.value !== "" && customersData[cSelect.value]
      ? customersData[cSelect.value].custId
      : "";

    cSelect.innerHTML = '<option value="">-- Select Customer --</option>';

    customersData.forEach((c, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = `${c.name} (${c.custId})`;
      if (c.custId === currentCustId) {
        opt.selected = true;
      }
      cSelect.appendChild(opt);
    });
  }

  function populateGuarantorDropdown(guarantors) {
    guarantorsData = guarantors || [];
    const gSelect = document.getElementById('guarantorSelect');
    const currentGName = gSelect.value !== "" && guarantorsData[gSelect.value]
      ? guarantorsData[gSelect.value].name
      : "";

    gSelect.innerHTML = '<option value="">-- Select Guarantor --</option>';

    guarantorsData.forEach((g, index) => {
      const opt = document.createElement('option');
      opt.value = index;
      opt.textContent = g.nickName ? `${g.name} (${g.nickName})` : g.name;
      if (g.name === currentGName) {
        opt.selected = true;
      }
      gSelect.appendChild(opt);
    });
  }

  window.addEventListener('DOMContentLoaded', () => {
    // 1. Load cached customers & guarantors immediately (0ms)
    const cachedCustomers = localStorage.getItem('nle_cached_customers');
    if (cachedCustomers) {
      try {
        populateCustomerDropdown(JSON.parse(cachedCustomers));
      } catch (e) {
        console.warn("Customer cache parse error", e);
      }
    }

    const cachedGuarantors = localStorage.getItem('nce_cached_guarantors');
    if (cachedGuarantors) {
      try {
        populateGuarantorDropdown(JSON.parse(cachedGuarantors));
      } catch (e) {
        console.warn("Guarantor cache parse error", e);
      }
    }

    // 2. Refresh lists in background
    fetch(SCRIPT_URL)
      .then(res => res.json())
      .then(response => {
        if (response.customers) {
          localStorage.setItem('nle_cached_customers', JSON.stringify(response.customers));
          populateCustomerDropdown(response.customers);
        }
        if (response.guarantors) {
          localStorage.setItem('nce_cached_guarantors', JSON.stringify(response.guarantors));
          populateGuarantorDropdown(response.guarantors);
        }
        if (response.loans) {
          localStorage.setItem('npe_cached_loans', JSON.stringify(response.loans));
        }
      })
      .catch(err => {
        console.error("Failed to load lists", err);
        if (!cachedCustomers) {
          document.getElementById('customerSelect').innerHTML = '<option value="">-- Failed to load --</option>';
        }
        if (!cachedGuarantors) {
          document.getElementById('guarantorSelect').innerHTML = '<option value="">-- Failed to load --</option>';
        }
      });
  });

  document.getElementById('loanForm').addEventListener('submit', function (e) {
    e.preventDefault();
    const status = document.getElementById('status');
    status.innerText = "";

    const selectedCIdx = document.getElementById('customerSelect').value;
    const selectedCustomer = { ...customersData[selectedCIdx] };

    const selectedGIdx = document.getElementById('guarantorSelect').value;
    const selectedGuarantor = guarantorsData[selectedGIdx];

    const loanDateVal = document.getElementById('loanDate').value;
    const firstColDateVal = document.getElementById('firstColDate').value;
    const loanAmtVal = document.getElementById('loanAmount').value;
    const paymentModeVal = document.getElementById('paymentMode').value;

    const submitBtn = document.getElementById('submitBtn');
    submitBtn.disabled = true;
    submitBtn.innerText = "Saving Loan...";

    const payload = {
      type: "loan",
      loanDate: loanDateVal,
      firstColDate: firstColDateVal,
      custId: selectedCustomer.custId,
      guarantorName: selectedGuarantor.name,
      loanAmt: loanAmtVal,
      paymentMode: paymentModeVal,
      disbursalRef: document.getElementById('disbursalRef').value.trim()
    };

    fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      const waMessage = buildLoanApprovalMessage(
        selectedCustomer.name,
        loanAmtVal,
        firstColDateVal,
        paymentModeVal
      );
      showLoanApprovalCard(selectedCustomer, waMessage);

      status.className = "success";
      status.innerText = "Loan successfully registered!";
      localStorage.removeItem('npe_cached_loans');
      localStorage.removeItem('nle_cached_customers');
      document.getElementById('loanForm').reset();
      setInitialDates();
    })
    .catch(err => {
      console.error(err);
      status.className = "error";
      status.innerText = "Failed to register loan.";
    })
    .finally(() => {
      submitBtn.disabled = false;
      submitBtn.innerText = "Save Loan";
    });
  });
</script>

</body>
</html>
